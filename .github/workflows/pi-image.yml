# Builds the Jam Session SD card image for a Raspberry Pi. See pi/README.md.
#
# Runs on "Run workflow" in the Actions tab, a push to the pi-image branch, or a pi-v* tag — which
# also attaches the image to a GitHub release. The website on Netlify is not involved.
name: Pi image

on:
  workflow_dispatch:
  push:
    branches: [pi-image]
    tags: ["pi-v*"]

permissions:
  contents: write

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # ⚠️ ARM64, so the chroot inside the image runs its programs natively rather than under
    # emulation. GitHub's arm64 runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The committed pages match src/
        run: python3 tools/build.py --check

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends parted fdisk e2fsprogs util-linux xz-utils zerofree curl

      - name: Build the image
        run: |
          set -o pipefail
          sudo env IMAGE_REV="${GITHUB_SHA::7}" pi/image/build.sh out 2>&1 | tee build.log

      # ⚠️ THE LOG NEEDS A SIGN-IN; ANNOTATIONS DO NOT. Anyone reading this public run signed out, or
      # through the API without a token, got "Process completed with exit code 1" and nothing more —
      # the first build failed exactly like that. So the parts worth reading are posted as annotations,
      # which the check-runs API serves to anyone: the base image's facts and the smoke test on every
      # run, and the end of the log when it fails.
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("build.log")
          lines = log.read_text(errors="replace").splitlines() if log.exists() else ["(no build.log)"]
          def data(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def prop(s):
              return data(s).replace(":", "%3A").replace(",", "%2C")
          # ⚠️ AN ANNOTATION KEEPS ABOUT 4 KB, AND A COMMA ENDS ITS TITLE. The second run posted the last 150
          # lines as one error: GitHub kept the first 4,096 characters — apt's output, none of the failure
          # that ended the log — under the title "build.sh", everything after the comma gone. So long text
          # goes out in pieces, newest last, and titles are escaped.
          def post(kind, title, chosen, pieces=4, size=3800):
              chunks, cur = [], ""
              for line in chosen:
                  line = line[:size]
                  if cur and len(cur) + len(line) + 1 > size:
                      chunks.append(cur)
                      cur = ""
                  cur += line + "\n"
              chunks.append(cur or "(nothing)")
              chunks = chunks[-pieces:]
              for i, text in enumerate(chunks, 1):
                  name = title if len(chunks) == 1 else "%s (%d of %d)" % (title, i, len(chunks))
                  print("::%s title=%s::%s" % (kind, prop(name), data(text.rstrip("\n"))))
          def section(start, stop):
              out, on = [], False
              for line in lines:
                  if line.startswith("==> "):
                      on = line.startswith(start) or (on and not line.startswith(stop))
                  if on:
                      out.append(line)
              return out
          post("notice", "the base image", section("==> the base image", "==> provision"))
          post("notice", "smoke test", section("==> smoke", "==> finish"))
          if "${{ job.status }}" != "success":
              post("error", "build.sh, last 150 lines", lines[-150:])
          PY

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: jam-session-pi-${{ github.sha }}
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/pi-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --title "Jam Session for Raspberry Pi ($GITHUB_REF_NAME)"
          --notes "Burn the .img.xz with Raspberry Pi Imager: Choose OS, Use custom. See pi/README.md."
