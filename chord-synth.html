const P_DEFAULT = Object.assign({}, P);
const state = {voice:"soft", motion:"hold", bpm:88, bpmExact:88, keyPc:0, prog:null, playing:false, bass:true};
/* Patches have carried three different shapes for this: a boolean, then the brief
   off/decay/sustain strings, now a boolean plus the Bass fader. Returns {on, sus},
   where sus is null when the patch didn't pin one. */
function normBass(v){
  if (v === "off" || v === false) return {on:false, sus:null};
  if (v === "sustain") return {on:true, sus:1};
  if (v === "decay") return {on:true, sus:.7};
  return {on:true, sus:null};
}
/* `ch` is the OUTPUT channel and never filtered anything coming IN — the app answered on
   every channel whatever this was set to. `inCh` is the input filter: -1 is omni, which is
   what the behaviour always effectively was, so the default changes nothing. */
const MIDI = {access:null, in:null, out:null, ch:0, inCh:-1, sync:"int", clockOn:true};
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.platform)
            || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
/* Shifts the transport's grid against incoming MIDI clock. Browser output latency puts
   audible notes behind the reference by a fixed amount, and nothing else compensates.
   `offsetMs` is that constant, dialled in by hand; the phase fields below are the
   time-varying part — following clock tempo alone lets position error integrate, because
   a tempo estimate that is 0.1% off is a tenth of a bar out after a hundred bars.
     pulse  counts 0xF8 since the last reset, so beat phase is pulse % 24
     err    smoothed phase error in SECONDS, positive = transport running ahead
     lock   whether that error is fed back into the grid, or only measured */
const SYNC = {offsetMs:0, lock:false, pulse:0, err:0, have:false, trim:0, hist:[]};
/* steps divide the bar, so 4/8/12/16 read as quarters, eighths, triplets, sixteenths */
const PULSE = {steps:8, on:[1,0,1,1,0,1,1,0]};
/* default is a single hit on the downbeat — i.e. the original one-note-per-bar bass */
const BASSQ = {steps:8, on:[1,0,0,0,0,0,0,0]};
const ARP = {dir:"updown", octaves:1, rate:"auto"};
/* "auto" keeps the adaptive behaviour: a sequence longer than a bar of eighths would never
   reach its top notes, so it doubles to sixteenths. Explicit rates divide the bar directly. */
const arpStepFor = (beat, seqLen) =>
  ARP.rate === "auto" ? (seqLen > 8 ? beat/4 : beat/2) : (beat * 4) / ARP.rate;
/* Swing as the share of each step-PAIR given to the first note: .5 is straight,
   .667 is triplet feel, .75 is a hard shuffle. Off-beats are pushed late by the rest. */
const SW = {ratio:.5};
/* bpmExact is what the transport runs on. state.bpm is only for display — deriving bar
   length from a rounded tempo is a fraction of a percent off, which is inaudible for one
   bar and a quarter of a second of drift per minute against external gear. */
const barSeconds = () => (60 / (state.bpmExact || state.bpm)) * 4;
/* pads default to one bar; anything from a quarter-bar to eight is allowed */
const chordBars = i => {
  const c = state.prog && state.prog.chords[i];
  return c && c.bars > 0 ? c.bars : 1;
};
const swungAt = (s, step) => s * step + ((s % 2) ? step * (2 * SW.ratio - 1) : 0);
const held = new Map();     // incoming midi note -> {recs, outNotes, slot}
const arping = new Map();   // held notes running a looping motion -> {slot, next, vel, recs}
const litPads = new Set();  // chord slots currently held from a pad
const LEARN = {on:false, target:null};
const padMap = new Map();   // learned: midi note -> chord slot
const ccMap  = new Map();   // learned: cc number -> fader id
/* assigned: program number -> patch name. One program selects exactly one patch, and a
   patch answers to at most one program, so the mapping reads the same in both directions.
   Kept even though the EP-133 turns out not to send program change — other gear does, and
   it costs nothing to answer it. */
const progMap = new Map();
/* assigned: midi note -> patch name. This is the one the EP-133 can actually drive, by
   putting a pad on a note. A note used this way is consumed and does NOT also play a chord. */
const patchNotes = new Map();
/* When a recall lands. Instant is jarring mid-phrase, so the default waits for the next
   chord boundary — a bar for the default one-bar pads, and always a musical seam. The
   transport only ever schedules whole chords, so that is the finest quantum available
   without rescheduling notes that have already been handed to the engine. */
const RECALL = {when:"bar", pending:null};
const faderCtl = {};        // fader id -> {set, el} so CC can drive them

function makeIR(seconds, decay){
  const rate = ctx.sampleRate, len = Math.floor(rate*seconds);
  const buf = ctx.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++){
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++){
      const t = i/len;
      d[i] = (Math.random()*2-1) * Math.pow(1-t, decay) * (1 - Math.exp(-i/400));
    }
  }
  return buf;
}

/* useCtx is for offline rendering, which needs THIS graph rather than a copy of it —
   the same argument MS·1's initAudio already carried. Online, the context and the
   output both come from the shell, so every instrument shares one time base. */
function initAudio(useCtx){
  if (ctx) return;
  ctx = useCtx || Patchwork.audio.context();
  const out = useCtx ? ctx.destination : Patchwork.audio.strip("cs1");
  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .006; comp.release.value = .25;
  master = ctx.createGain(); master.gain.value = P.level;
  dry = ctx.createGain(); wet = ctx.createGain();
  verb = ctx.createConvolver(); verb.buffer = makeIR(2.8, 2.6);
  /* reverb lands on master, NOT on the compressor. Feeding wet into comp meant more Space
     just bought more gain reduction — the fader's top half did nothing — and it pumped the
     tails in time with the chords. */
  dry.connect(comp); wet.connect(verb); verb.connect(master);
  comp.connect(master); master.connect(out);
  /* one shared cutoff signal every live note reads from, so Tone moves under sounding notes */
  cutSrc = ctx.createConstantSource();
  cutSrc.offset.value = toneHz();
  cutSrc.start();
  /* PeriodicWaves need the context, so they're built here rather than at parse time */
  periodic = {};
  Object.keys(PERIODIC_SPEC).forEach(k => {
    const mags = PERIODIC_SPEC[k];
    const real = new Float32Array(mags.length), imag = new Float32Array(mags.length);
    for (let i = 0; i < mags.length; i++) imag[i] = mags[i];
    periodic[k] = ctx.createPeriodicWave(real, imag, {disableNormalization:false});
  });
  applySpace();
}
/* 3x, not .85x — the ConvolverNode normalizes a 2.8s noise IR down hard, so the old
   send sat around -23dB at the default and was effectively inaudible */
/* iOS parks the context in "suspended" until a gesture, and in "interrupted" after a call
   or an app switch — so anything other than "running" needs a resume, not just "suspended". */
function ensureAudio(){
  initAudio();
  Patchwork.audio.resume();
  /* Every other ioStats() call sits on a device-picker path, and those are disabled on
     iOS — so without this the stats line never appears on the one platform where it's
     the only way to read latency. Repeat once the context is actually running, since
     outputLatency isn't meaningful until then. */
  if (typeof ioStats === "function"){
    ioStats();
    setTimeout(ioStats, 400);
  }
  return ctx.state;
}

function applySpace(){ if (wet) wet.gain.setTargetAtTime(P.space * 3, ctx.currentTime, .02); }
const curve = (v,lo,hi) => lo * Math.pow(hi/lo, v);
/* 25Hz shuts the sound off entirely; 16kHz is past anything the oscillators put out, so the
   top of the fader is genuinely open. Voice `cut` multiplies this and BiquadFilterNode
   clamps at Nyquist, so bell's 1.5x simply saturates rather than misbehaving. */
const TONE_MIN = 25, TONE_MAX = 16000;
const toneHz = () => curve(P.tone, TONE_MIN, TONE_MAX);
const REL_MIN = .08, REL_MAX = 6;
const relTime = () => Math.max(.06, curve(P.release, REL_MIN, REL_MAX));

function trigger(midi, t, hold, opts){
  const o = opts || {};
  const V = VOICES[state.voice];
  /* clamp attack so a slow attack can't outrun a short note and leave the envelope mid-ramp */
  const atk = Math.min(curve(P.attack, .004, 1.4), hold * .8);
  const rel = relTime();
  const cutMul = o.bass ? .5 : V.cut;
  const detMul = o.bass ? .3 : 1;
  const basePan = o.bass ? 0 : (o.pan || 0);
  const peak = (o.gain != null ? o.gain : V.lvl) * (o.bass ? 1.15 : 1);
  const freq = 440 * Math.pow(2,(midi-69)/12);
  const decEnd = Math.min(atk + Math.min(hold*.9, 1.6), hold * .99);

  /* susAmt (0..1) gives a continuously variable envelope tail, used by the bass:
       0    — falls to 2% in ~0.35s, a hard pluck
       1    — no decay at all, holds at full level
     Absent means the standard chord-note shape: dip to 72%, then hold. */
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(peak, t + atk);
  let susLevel;
  if (o.susAmt != null && o.susAmt >= .98){
    susLevel = peak;
  } else if (o.susAmt != null){
    /* the fall time is capped so a plucked bass dies at the same rate whether the pad
       is one bar or eight, instead of stretching to fit */
    const fallEnd = Math.min(hold * .99, atk + curve(o.susAmt, .35, 4));
    susLevel = Math.max(peak * curve(o.susAmt, .02, 1), .0002);
    env.gain.exponentialRampToValueAtTime(susLevel, t + fallEnd);
  } else {
    susLevel = peak * .72;
    env.gain.linearRampToValueAtTime(susLevel, t + decEnd);
  }

  const filt = ctx.createBiquadFilter();
  /* the bass always stays lowpass — a bandpass or highpass voice would gut the low end */
  filt.type = o.bass ? "lowpass" : (V.filter || "lowpass");
  filt.Q.value = o.bass ? .7 : V.q;
  filt.frequency.value = CUT_FLOOR;
  /* the envelope is a multiplier on the shared cutoff, not an absolute frequency */
  const cutEnv = ctx.createGain();
  cutEnv.gain.setValueAtTime(.55 * cutMul, t);
  cutEnv.gain.linearRampToValueAtTime(cutMul, t + atk + .04);
  /* the filter closing is the other half of the trail-off, so it tracks susAmt too */
  const cutEnd = o.susAmt != null ? (.34 + .62 * o.susAmt) : .62;
  cutEnv.gain.exponentialRampToValueAtTime(cutEnd * cutMul, t + hold + rel);
  cutSrc.connect(cutEnv);
  cutEnv.connect(filt.frequency);

  const pan = ctx.createStereoPanner();
  pan.pan.value = basePan * P.spread;

  env.connect(filt); filt.connect(pan);
  pan.connect(dry);
  if (!o.bass) pan.connect(wet); else { const bw = ctx.createGain(); bw.gain.value = .35; pan.connect(bw); bw.connect(wet); }

  const oscs = [];
  const specs = o.bass ? [["triangle",0,.6],["sine",0,.5]] : V.oscs;
  specs.forEach((sp, i) => {
    const osc = ctx.createOscillator();
    if (STD_WAVES.indexOf(sp[0]) >= 0) osc.type = sp[0];
    else if (periodic[sp[0]]) osc.setPeriodicWave(periodic[sp[0]]);
    else osc.type = "sine";
    osc.frequency.value = freq * Math.pow(2, sp[1]/12);
    /* voice detune is fixed character; Spread is the player's control, so they add */
    osc.detune.value = (sp[3] || 0) + (i % 2 ? 1 : -1) * P.spread * 22 * detMul;
    const g = ctx.createGain(); g.gain.value = sp[2];
    osc.connect(g); g.connect(env);
    osc.start(t);
    oscs.push(osc);
  });

  const rec = {env, oscs, filt, pan, cutEnv, basePan, detMul, t, hold, peak, rel,
               sus:susLevel, oscDet:specs.map(sp => sp[3] || 0)};
  /* the tail is re-schedulable so the Release fader can move under a sounding note */
  rec.tail = function(r){
    rec.rel = r;
    const end = rec.t + rec.hold + r;
    env.gain.cancelScheduledValues(rec.t + rec.hold);
    env.gain.setValueAtTime(rec.sus, rec.t + rec.hold);
    env.gain.exponentialRampToValueAtTime(.0001, end);
    oscs.forEach(x => { try{ x.stop(end + .05); }catch(e){} });
  };
  rec.tail(rel);

  active.add(rec);
  oscs[0].onended = () => {
    active.delete(rec);
    try{ cutSrc.disconnect(cutEnv); }catch(e){}
    try{ cutEnv.disconnect(); env.disconnect(); filt.disconnect(); pan.disconnect(); }catch(e){}
  };
  return rec;
}

/* fade a note out now, at the current Release setting — used by pad note-off */
function releaseRec(rec, when){
  if (!ctx) return;
  const t = when == null ? ctx.currentTime : when;
  const r = relTime();
  try{
    rec.env.gain.cancelScheduledValues(t);
    rec.env.gain.setValueAtTime(Math.max(rec.env.gain.value, .0001), t);
    rec.env.gain.exponentialRampToValueAtTime(.0001, t + r);
    rec.oscs.forEach(o => { try{ o.stop(t + r + .05); }catch(e){} });
  }catch(e){}
}

function killAll(){
  if (!ctx) return;
  const t = ctx.currentTime;
  active.forEach(rec => {
    try{
      rec.env.gain.cancelScheduledValues(t);
      rec.env.gain.setValueAtTime(Math.max(rec.env.gain.value, .0001), t);
      rec.env.gain.exponentialRampToValueAtTime(.0001, t + .18);
      rec.oscs.forEach(o => { try{ o.stop(t + .22); }catch(e){} });
    }catch(e){}
  });
}

/* push a fader move into notes that are already sounding */
function refreshLive(id){
  if (!ctx) return;
  const now = ctx.currentTime;
  if (id === "tone"){
    if (cutSrc) cutSrc.offset.setTargetAtTime(toneHz(), now, .03);
  } else if (id === "spread"){
    const d = P.spread * 22;
    active.forEach(rec => {
      try{
        rec.pan.pan.setTargetAtTime(rec.basePan * P.spread, now, .02);
        rec.oscs.forEach((o, i) => o.detune.setTargetAtTime(
          (rec.oscDet ? rec.oscDet[i] || 0 : 0) + (i % 2 ? d : -d) * rec.detMul, now, .02));
      }catch(e){}
    });
  } else if (id === "release"){
    const r = relTime();
    active.forEach(rec => { if (now < rec.t + rec.hold) { try{ rec.tail(r); }catch(e){} } });
  }
}

/* one note event list per bar, shared by the internal engine and MIDI out */
function chordEvents(i, t){
  const prog = state.prog;
  if (!prog || !prog.chords[i] || !prog.voicings[i]) return [];
  const beat = 60 / state.bpm;
  const bar = beat * 4;
  const bars = chordBars(i);
  const span = bar * bars;              // how long this pad actually holds
  const ch = prog.chords[i];
  const notes = prog.voicings[i];
  const motion = state.motion;

  /* Bass runs its own step sequence, repeating each bar like Pulse does. Each hit lasts
     until the next one (or the end of the chord), and the Decay fader shapes that span —
     so a single step at full decay is one note held under the whole bar, and a busier
     pattern gives a bass line. Deliberately NOT swung: the Swing control only appears for
     Arp and Pulse, and a hidden control shouldn't move these notes. */
  const ev = [];
  if (state.bass){
    const bn = Math.max(1, BASSQ.steps);
    const bStep = bar / bn;
    const bTotal = Math.max(1, Math.round(bn * bars));
    const hits = [];
    for (let s = 0; s < bTotal; s++) if (BASSQ.on[s % bn]) hits.push(s * bStep);
    hits.forEach((at, k) => {
      const until = (k + 1 < hits.length) ? hits[k + 1] : span;
      /* velocity tracks the level so external gear follows the same mix move */
      ev.push({n:bassNote(ch, state.keyPc), t:t + at, d:Math.max(.05, (until - at) * .99),
               bass:true, gain:bassGain(), susAmt:P.bassSus,
               vel:Math.max(1, Math.min(127, Math.round(76 * P.bassLvl / .5)))});
    });
  }
  const spread = notes.length > 1 ? 1.2 / (notes.length - 1) : 0;

  if (motion === "hold" || motion === "strum"){
    const off = motion === "strum" ? .045 : 0;
    notes.forEach((n, k) => ev.push({n, t:t + k*off, d:span*.94 - k*off, pan:-0.6 + k*spread, vel:98}));
  } else if (motion === "arp"){
    const seq = arpSequence(notes);
    /* rate is per bar, so a longer pad gets proportionally more notes — the run keeps
       going rather than stretching, which would change the arp's speed */
    const step = arpStepFor(beat, seq.length);
    const steps = Math.max(1, Math.round(span / step));
    let prev = -1;
    for (let s = 0; s < steps; s++){
      let idx;
      if (ARP.dir === "random"){
        idx = Math.floor(Math.random() * seq.length);
        if (seq.length > 1 && idx === prev) idx = (idx + 1) % seq.length;   // no immediate repeats
      } else {
        idx = s % seq.length;
      }
      prev = idx;
      /* duration follows the gap to the NEXT swung step, so shuffled off-beats don't
         run past the downbeat that follows them */
      const at = swungAt(s, step), gap = swungAt(s+1, step) - at;
      ev.push({n:seq[idx], t:t + at, d:gap*1.45,
               pan:-0.5 + (s % notes.length)*spread, gain:VOICES[state.voice].lvl*.85, vel:88});
    }
  } else {
    const n = Math.max(1, PULSE.steps);
    const step = bar / n;                       // step size stays tied to ONE bar...
    const total = Math.max(1, Math.round(n * bars));   // ...and the pattern repeats over the pad
    for (let s = 0; s < total; s++){
      if (!PULSE.on[s % n]) continue;
      const at = swungAt(s, step), gap = swungAt(s+1, step) - at;
      notes.forEach((nn,k) => ev.push({n:nn, t:t + at, d:gap*.85,
                                       pan:-0.5 + k*spread, gain:VOICES[state.voice].lvl*.62, vel:84}));
    }
  }
  return ev;
}

/* Octaves stack upward from the voicing, then direction reshapes the run.
   Random picks per step at schedule time, so it isn't baked into the sequence. */
function arpSequence(notes){
  const base = [];
  for (let o = 0; o < ARP.octaves; o++){
    notes.forEach(n => { const p = n + 12*o; if (p <= 108) base.push(p); });
  }
  base.sort((a,b) => a-b);
  if (!base.length) return notes.slice();
  if (ARP.dir === "down") return base.slice().reverse();
  if (ARP.dir === "updown") return base.length > 2 ? base.concat(base.slice(1,-1).reverse()) : base;
  return base;    // up, and random (index chosen per step above)
}

function scheduleChord(i, t){
  chordEvents(i, t).forEach(e => {
    trigger(e.n, e.t, e.d, {bass:e.bass, gain:e.gain, pan:e.pan, susAmt:e.susAmt});
    sendNote(e.n, e.t, e.d, e.vel);
  });
}

/* Render a chord into an OfflineAudioContext, the way MS·1's renderPatch does.

   CS·1 had no offline harness, which is why its twelve voices carry a measured 8.2 dB
   spread while MS·1's twenty patches sit within a fraction of a dB — one instrument's
   levels were dialled and the other's were measured. This is the rig that makes CS·1's
   measurable too, and Phase 3 needed it for a different reason: without it there was no
   way to put a number on what the two instruments cost together.

   Saves and restores the live graph exactly as MS·1's does, so calling it while the
   transport is running does not disturb what is sounding. */
async function renderChord(opts){
  const o = opts || {};
  const dur = o.dur || 2.0, rate = o.rate || 48000;
  const saved = {ctx, master, dry, wet, verb, comp, cutSrc, periodic};
  const savedActive = Array.from(active);
  active.clear();
  ctx = null;
  const off = new OfflineAudioContext(2, Math.ceil(rate * dur), rate);
  try{
    initAudio(off);
    if (o.voice) state.voice = o.voice;
    const notes = o.notes || [48, 52, 55, 59, 62, 67];
    const gate = o.gate == null ? dur : o.gate;
    notes.forEach((n, i) => trigger(n, 0, gate, {gain: o.gain, pan: o.pan ? (i / notes.length - .5) * 2 : 0}));
    return await off.startRendering();
  } finally {
    active.forEach(v => { try{ v.stop && v.stop(); }catch(e){} });
    active.clear();
    ctx = saved.ctx; master = saved.master; dry = saved.dry; wet = saved.wet;
    verb = saved.verb; comp = saved.comp; cutSrc = saved.cutSrc; periodic = saved.periodic;
    savedActive.forEach(v => active.add(v));
  }
}

/* ---- transport ---- */
/* gridBeats is the musical position of nextTime, in beats since playback started. Keeping
   it alongside nextTime is what makes phase measurable at all: nextTime alone says when the
   next chord lands, not where the grid thinks it is relative to anyone else's bar. */
let timer = null, nextTime = 0, nextIndex = 0, marks = [], gridBeats = 0;
const beatSeconds = () => barSeconds() / 4;
/* Transport's musical position at an audio-clock time, interpolated back from the grid. */
const beatsAt = t => gridBeats - (nextTime - t) / beatSeconds();
function startPlay(){
  ensureAudio();
  state.playing = true;
  nextIndex = 0;
  gridBeats = 0;
  phaseReset();
  /* Just enough that the first chord isn't scheduled into the past — the tick runs every
     25ms. This used to be 80ms, which was the dominant term in the clock offset people
     had to dial out, and pure delay on the Play button besides. */
  /* The shell places this on the running grid if another instrument is already going,
     and defines the grid from here if not — so a standalone build starts exactly where
     it always did, and two instruments started seconds apart are still in phase. */
  nextTime = Patchwork.clock.claim(4);
  marks = [];
  tick();
  Patchwork.clock.run(tick);
  timer = tick;
  playBtn.classList.add("on");
  playBtn.textContent = "■ Stop";
  requestAnimationFrame(paint);
}
function tick(){
  /* nextTime is the musical grid; `off` shifts what's actually scheduled against it, so a
     negative offset pulls playback ahead of an external clock. Lookahead is widened by the
     offset so a negative shift can't ask for a time that has already passed. */
  const off = SYNC.offsetMs / 1000;
  while (nextTime + off < ctx.currentTime + .2 + Math.abs(off)){
    /* a queued patch lands here, on the seam, before anything for this chord is scheduled —
       so the progression that gets played from this boundary is the new one */
    takePending();
    /* and a queued scene, at the loop point rather than every chord — same reasoning,
       generalised across the instruments in shell/scenes.js */
    const at = Math.max(ctx.currentTime + .005, nextTime + off);
    Patchwork.scenes.take("cs1", at);
    /* take() can STOP this instrument, when the row it fired has nothing for it.
       The loop would otherwise carry on scheduling into a transport that is no
       longer running and leave a bar of notes behind after the stop. */
    if (!state.playing) return;
    const bars = chordBars(nextIndex);
    const dur = barSeconds() * bars;
    scheduleChord(nextIndex, at);
    marks.push({i:nextIndex, t:at, end:at + dur});
    /* The grid advances by the exact musical length; the correction is applied to the
       wall-clock step only, so gridBeats stays an honest count of beats played. */
    nextTime += phaseAdjust(dur);
    gridBeats += 4 * bars;
    nextIndex = (nextIndex + 1) % state.prog.chords.length;
  }
  /* quarter-bar pads burn through marks far faster than whole bars did */
  while (marks.length > 12) marks.shift();
}
function stopPlay(){
  state.playing = false;
  Patchwork.clock.stop(tick); timer = null;
  /* release held pads first — midiPanic's all-notes-off would cut them on the external
     synth anyway, and leaving their loops running would desync internal from external */
  allPadsOff();
  killAll();
  midiPanic();
  playBtn.classList.remove("on");
  playBtn.textContent = "▶ Play";
  $$(".chord").forEach((c, idx) => {
    c.classList.toggle("on", litPads.has(idx));
    c.querySelector(".wipe").style.width = "0%";
  });
  clearSteps();
}
function paint(){
  if (!state.playing) return;
  const now = ctx.currentTime;
  let cur = null;
  for (const m of marks) if (now >= m.t && now < m.end) cur = m;
  const cards = $$(".chord");
  cards.forEach((c, idx) => {
    const on = cur && cur.i === idx;
    c.classList.toggle("on", !!on || litPads.has(idx));
    c.querySelector(".wipe").style.width = on ? (((now - cur.t)/(cur.end - cur.t))*100).toFixed(1) + "%" : "0%";
  });
  paintSteps(cur, now);
  requestAnimationFrame(paint);
}

/* playhead on both step grids, derived from progress through the current chord */
function paintSteps(cur, now){
  const frac = cur ? (now - cur.t) / (cur.end - cur.t) : -1;
  const mark = (el, cfg, active) => {
    /* patterns repeat per bar, so wrap the position by the chord's length in bars */
    const bars = cur ? Math.max(1, chordBars(cur.i)) : 1;
    const idx = (active && frac >= 0)
      ? Math.floor(frac * cfg.steps * bars) % cfg.steps : -1;
    for (let s = 0; s < el.children.length; s++)
      el.children[s].classList.toggle("now", s === idx);
  };
  mark(stepGrid, PULSE, state.motion === "pulse");
  mark(bassGrid, BASSQ, state.bass);
}
function clearSteps(){
  for (const b of stepGrid.children) b.classList.remove("now");
  for (const b of bassGrid.children) b.classList.remove("now");
}

/* One-shot trigger for a click, a key press or a pad. Runs the SAME event list the
   sequencer uses, so Strum/Arp/Pulse behave identically whether or not it's playing —
   they used to be silently flattened to Hold here. */
function stab(i){
  if (!state.prog) return;
  ensureAudio();
  const t = ctx.currentTime + .02;   // nudge off "now" so nothing schedules into the past
  chordEvents(i, t).forEach(e => {
    trigger(e.n, e.t, e.d, {bass:e.bass, gain:e.gain, pan:e.pan, susAmt:e.susAmt});
    sendNote(e.n, e.t, e.d, e.vel);
  });
}

/* ============ ui ============ */
const chordsEl = $("#chords"), metaEl = $("#meta"), playBtn = $("#play"), keySel = $("#key"), moodSel = $("#mood"), tempoOut = $("#tempoOut"), lenSel = $("#len"), modeSel = $("#mode"), modeNote = $("#modeNote"), totalBarsEl = $("#totalBars");

/* Only list moods that can actually satisfy the selected mode — offering Dusk under
   "Major" just to report a fallback afterwards is confusing. Built from POOLS, so a new
   pool appears automatically and lands in the right lists. */
function syncMoodOptions(){
  const wantMinor = modeSel.value === "minor" ? true
                  : modeSel.value === "major" ? false : null;
  const allowed = wantMinor === null ? MOODS : MOODS.filter(m => moodHas(m, wantMinor));
  const prev = moodSel.value;
  moodSel.innerHTML = "";

    {value:"any", textContent:"Anything"}));
  allowed.forEach(m => moodSel.appendChild(
    Object.assign(document.createElement("option"), {value:m, textContent:title(m)})));
  const kept = prev === "any" || allowed.indexOf(prev) >= 0;
  moodSel.value = kept ? prev : "any";
  return kept ? null : prev;    // the mood that had to be dropped, if any
}

const FADERS = [
  {id:"tone",    lab:"Tone",    g:1, fmt:v => Math.round(curve(v,TONE_MIN,TONE_MAX)) + "Hz"},
  {id:"attack",  lab:"Attack",  g:1, fmt:v => (curve(v,.004,1.4)*1000 < 999 ? Math.round(curve(v,.004,1.4)*1000)+"ms" : curve(v,.004,1.4).toFixed(2)+"s")},
  {id:"release", lab:"Release", g:1, fmt:v => curve(v,REL_MIN,REL_MAX).toFixed(2)+"s"},
  {id:"space",   lab:"Space",   g:2, fmt:v => Math.round(v*100)+"%"},
  {id:"spread",  lab:"Spread",  g:2, fmt:v => Math.round(v*100)+"%"},
  {id:"level",   lab:"Level",   g:2, fmt:v => Math.round(v*100)+"%"}
];

const fadersEl = $("#faders");
FADERS.forEach(f => {
  const el = document.createElement("div");
  el.className = "fader g" + f.g;
  el.tabIndex = 0;
  el.setAttribute("role","slider");
  el.setAttribute("aria-label", f.aria || f.lab);
  el.setAttribute("aria-valuemin","0");
  el.setAttribute("aria-valuemax","100");
  el.innerHTML = '<div class="slot"><div class="cap"></div></div><div class="lab">'+f.lab+'</div><div class="val"></div><div class="bind"></div>';
  fadersEl.appendChild(el);
  const slot = el.querySelector(".slot"), cap = el.querySelector(".cap"), val = el.querySelector(".val");

  function render(){
    const v = P[f.id];
    cap.style.setProperty("--v", v);
    val.textContent = f.fmt(v);
    el.setAttribute("aria-valuenow", Math.round(v*100));
    el.setAttribute("aria-valuetext", f.fmt(v));
  }
  function set(v){
    P[f.id] = Math.min(1, Math.max(0, v));
    if (f.id === "level" && master) master.gain.setTargetAtTime(P.level, ctx.currentTime, .02);
    else if (f.id === "space") applySpace();
    else refreshLive(f.id);
    render();
  }
  function fromEvent(e){
    const r = slot.getBoundingClientRect();
    set(1 - (e.clientY - r.top - 11) / (r.height - 22));
  }
  el.addEventListener("pointerdown", e => {
    if (LEARN.on){ arm({type:"fader", id:f.id}, el); e.preventDefault(); return; }
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    fromEvent(e); e.preventDefault();
  });
  el.addEventListener("pointermove", e => { if (el.hasPointerCapture(e.pointerId)) fromEvent(e); });
  el.addEventListener("pointerup", e => { el.classList.remove("dragging"); el.releasePointerCapture(e.pointerId); });
  el.addEventListener("keydown", e => {
    const k = e.key;
    if (k === "ArrowUp" || k === "ArrowRight") set(P[f.id] + .02);
    else if (k === "ArrowDown" || k === "ArrowLeft") set(P[f.id] - .02);
    else if (k === "PageUp") set(P[f.id] + .1);
    else if (k === "PageDown") set(P[f.id] - .1);
    else if (k === "Home") set(0);
    else if (k === "End") set(1);
    else return;
    e.preventDefault();
  });
  faderCtl[f.id] = {set, el};
  render();
});

/* Horizontal faders live outside the bank but register in the same place, so MIDI learn,
   patch save and CC control all treat them exactly like the vertical ones. */
function makeHFader(sel, param, fmt){
  const el = $(sel), slot = el.querySelector(".hslot"),
        cap = el.querySelector(".hcap"), val = el.querySelector(".hval");
  function render(){
    cap.style.setProperty("--v", P[param]);
    val.textContent = fmt(P[param]);
    el.setAttribute("aria-valuenow", Math.round(P[param] * 100));
    el.setAttribute("aria-valuetext", fmt(P[param]));
  }
  function set(v){ P[param] = Math.min(1, Math.max(0, v)); render(); }
  function fromEvent(e){
    const r = slot.getBoundingClientRect();
    set((e.clientX - r.left - 11) / (r.width - 22));
  }
  el.addEventListener("pointerdown", e => {
    if (LEARN.on){ arm({type:"fader", id:param}, el); e.preventDefault(); return; }
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    fromEvent(e); e.preventDefault();
  });
  el.addEventListener("pointermove", e => { if (el.hasPointerCapture(e.pointerId)) fromEvent(e); });
  el.addEventListener("pointerup", e => { el.classList.remove("dragging"); el.releasePointerCapture(e.pointerId); });
  el.addEventListener("keydown", e => {
    const k = e.key;
    if (k === "ArrowRight" || k === "ArrowUp") set(P[param] + .02);
    else if (k === "ArrowLeft" || k === "ArrowDown") set(P[param] - .02);
    else if (k === "PageUp") set(P[param] + .1);
    else if (k === "PageDown") set(P[param] - .1);
    else if (k === "Home") set(0);
    else if (k === "End") set(1);
    else return;
    e.preventDefault();
  });
  faderCtl[param] = {set, el};
  render();
}

makeHFader("#bassSusFader", "bassSus",

/* dB against unity at the midpoint, which is how a level control should read */
makeHFader("#bassLvlFader", "bassLvl", v => {

});

function buildVoicings(prog){
  let prev = null;
  prog.voicings = prog.chords.map(ch => {
    const v = voiceChord(ch, state.keyPc, prev);
    prev = v.center;
    return v.notes;
  });
}

function keyMinor(){ return !!(state.prog && state.prog.minor); }

let openPad = null;
function syncPadEditors(){

}

/* Readable names for every quality in QUAL, so the type list isn't raw keys */
const QUAL_LABEL = {
  maj:"major", min:"minor", dim:"dim", sus2:"sus2", sus4:"sus4", six:"6", m6:"m6",
  maj7:"maj7", min7:"m7", dom7:"7 (dom)", m7b5:"m7♭5",
  add9:"add9", madd9:"m(add9)", maj9:"maj9", min9:"m9", dom9:"9"
};
const QUAL_ORDER = ["maj","min","dim","sus2","sus4","six","m6",
                    "maj7","min7","dom7","m7b5","add9","madd9","maj9","min9","dom9"];

/* quarter-bar resolution from ¼ up to 8 */
const BAR_STEPS = Array.from({length:32}, (_, i) => (i + 1) / 4);
function barsLabel(v){
  const whole = Math.floor(v);
  const frac = {0:"", 0.25:"¼", 0.5:"½", 0.75:"¾"}[+(v - whole).toFixed(2)] || "";
  if (whole === 0) return frac + " bar";
  return whole + frac + (v === 1 ? " bar" : " bars");
}

function fillRootOptions(sel, cur){
  const m = keyMinor();
  sel.innerHTML = "";
  for (let r = 0; r < 12; r++){
    const opt = document.createElement("option");
    opt.value = String(r);
    opt.textContent = rootName(r, state.keyPc, m) + "   " + RN[r];
    sel.appendChild(opt);
  }
  sel.value = String(((cur.r % 12) + 12) % 12);
}
function fillQualOptions(sel, cur){
  sel.innerHTML = "";
  QUAL_ORDER.forEach(q => {
    if (!QUAL[q]) return;
    const opt = document.createElement("option");
    opt.value = q;
    opt.textContent = QUAL_LABEL[q] || q;
    sel.appendChild(opt);
  });
  sel.value = cur.q;
}
function fillBarsOptions(sel, cur){
  sel.innerHTML = "";
  BAR_STEPS.forEach(v => {
    const opt = document.createElement("option");
    opt.value = String(v);
    opt.textContent = barsLabel(v);
    sel.appendChild(opt);
  });
  sel.value = String(cur.bars > 0 ? cur.bars : 1);
}

function editChord(i, patch){
  const p = state.prog;
  if (!p || !p.chords[i]) return;
  const cur = p.chords[i];
  const next = {r:cur.r, q:cur.q, bars:cur.bars || 1};
  if (patch.r != null) next.r = patch.r;
  if (patch.q != null && QUAL[patch.q]) next.q = patch.q;
  if (patch.bars != null) next.bars = patch.bars;
  p.chords[i] = next;
  if (patch.r != null || patch.q != null){
    buildVoicings(p);     // voice leading is a chain, so one edit revoices the rest
  }
  renderProgression();
}

function updateTotalBars(){
  const p = state.prog;
  if (!p){ totalBarsEl.textContent = ""; return; }
  const total = p.chords.reduce((sum, _, i) => sum + chordBars(i), 0);
  totalBarsEl.textContent = "· " + (+total.toFixed(2)) + (total === 1 ? " bar" : " bars");
}

/* only C♯/D♭, F♯/G♭ and G♯/A♭ differ between the two spellings, but leaving the picker
   on the major name while the card says the other one reads as a bug */
function relabelKeys(){
  const m = keyMinor();
  for (let pc = 0; pc < 12; pc++) keySel.options[pc].textContent = noteName(pc, pc, m);
}

/* The "pattern" boundary is CS·1's progression coming round, so the shell needs its
   length in bars. Reported whenever the progression is drawn, which is every time it
   changes. */
function reportPatternBars(){
  if (!state.prog || !window.Patchwork || !Patchwork.scenes) return;
  const bars = state.prog.chords.reduce((n, c) => n + (c.bars || 1), 0);
  /* CS·1 no longer sets the page's pattern length. It is a setting in the Scenes head now,
     and the bar counter there draws it — see shell/scenes.js. */
}
function renderProgression(){
  reportPatternBars();
  const p = state.prog;
  /* 3 wide, filled bottom-up, so chord 1 sits bottom-left like pad 1 on the EP-133.
     Placement is explicit rather than reversing the DOM — that keeps document order at
     1..n, which paint(), flashPad() and the pad badges all index into. */
  const cols = Math.min(3, p.chords.length);
  const rows = Math.ceil(p.chords.length / cols);
  chordsEl.innerHTML = "";
  p.chords.forEach((ch, i) => {
    const pad = document.createElement("div");
    pad.className = "pad";
    pad.style.gridRow = String(rows - Math.floor(i / cols));
    pad.style.gridColumn = String((i % cols) + 1);

    const bars = chordBars(i);
    const b = document.createElement("button");
    b.className = "chord";
    const note = padNoteFor(i);
    b.innerHTML = '<span class="wipe"></span><span class="name">'+chordName(ch, state.keyPc, p.minor)+'</span><span class="rn">'+romanName(ch)+'</span>'
      + (note == null ? '' : '<span class="bind">'+midiNoteLabel(note)+'</span>')
      + (bars === 1 ? '' : '<span class="len">'+barsLabel(bars)+'</span>');
    b.addEventListener("click", () => {
      if (LEARN.on) arm({type:"pad", i}, b);
      else stab(i);
    });

    const pick = document.createElement("span");
    pick.className = "pick";
    pick.innerHTML = '<button type="button" aria-label="Edit pad '+(i+1)+'" aria-expanded="false">▾</button>';

    const edit = document.createElement("div");
    edit.className = "pad-edit";
    edit.hidden = true;
    /* anchor right for the last column so the panel can't run off the card */
    if (i % cols === cols - 1){ edit.style.right = "0"; } else { edit.style.left = "0"; }
    edit.innerHTML = '<label>Root <select class="pe-root"></select></label>'
                   + '<label>Type <select class="pe-qual"></select></label>'
                   + '<label>Length <select class="pe-bars"></select></label>';
    const rootSel = edit.querySelector(".pe-root"),
          qualSel = edit.querySelector(".pe-qual"),
          barsSel = edit.querySelector(".pe-bars");
    fillRootOptions(rootSel, ch);
    fillQualOptions(qualSel, ch);
    fillBarsOptions(barsSel, {bars});
    rootSel.addEventListener("change", () => editChord(i, {r:parseInt(rootSel.value, 10)}));
    qualSel.addEventListener("change", () => editChord(i, {q:qualSel.value}));
    barsSel.addEventListener("change", () => editChord(i, {bars:parseFloat(barsSel.value)}));
    edit.addEventListener("click", e => e.stopPropagation());

    pick.querySelector("button").addEventListener("click", e => {
      e.stopPropagation();
      openPad = (openPad === i) ? null : i;
      syncPadEditors();
    });

    pad.appendChild(b);
    pad.appendChild(pick);
    pad.appendChild(edit);
    chordsEl.appendChild(pad);
  });
  syncPadEditors();     // an edit re-renders the pads, so reopen whichever was open
  updateTotalBars();
  relabelKeys();
  chordsEl.style.gridTemplateColumns = "repeat(" + cols + ",minmax(0,1fr))";
  updateMeta();
}

/* meta line only — never rebuilds the chord grid, so it's safe to call from the clock */
function updateMeta(){
  const p = state.prog; if (!p) return;
  metaEl.textContent = noteName(state.keyPc, state.keyPc, p.minor) + (p.minor ? " minor" : " major")
    + " · " + title(p.mood) + " · " + state.bpm + " bpm"
    + (MIDI.sync === "ext" ? " · ext" : "");
}

function newProgression(){
  if (keySel.value === "rand") state.keyPc = Math.floor(Math.random()*12);
  else state.keyPc = parseInt(keySel.value,10);
  state.prog = makeProgression(
    moodSel.value,
    lenSel.value === "auto" ? 0 : parseInt(lenSel.value, 10),
    modeSel.value
  );
  buildVoicings(state.prog);
  renderProgression();
  const p = state.prog;
  modeNote.style.display = p.fallback ? "" : "none";
  if (p.fallback){
    modeNote.textContent = title(p.mood) + " has no " + modeSel.value + " progressions — "
      + "generated in " + (p.minor ? "minor" : "major") + " instead.";
  }
  if (state.playing){ nextIndex = 0; }
}

$("#gen").addEventListener("click", () => { newProgression(); if (!state.playing) startPlay(); });
playBtn.addEventListener("click", () => state.playing ? stopPlay() : startPlay());

function setBpm(v, exact, fromShell){
  /* keep the unrounded value for the transport; round only for the readout */
  const clamped = Math.min(180, Math.max(50, v));
  state.bpmExact = exact ? clamped : Math.round(clamped);
  /* Tempo is the page's, not this panel's. Skipped when the shell is the one telling us,
     or the two instruments would bounce a change back and forth. */
  if (!fromShell) Patchwork.clock.setBpm(state.bpmExact, "cs1");
  const shown = Math.round(clamped);
  if (shown !== state.bpm){
    state.bpm = shown;
    tempoOut.textContent = shown;
    updateMeta();
    updateSwingHint();
  }
}

  else state.keyPc = Math.floor(Math.random()*12);
  buildVoicings(state.prog); renderProgression();
});

function updateSwingHint(){
  /* setBpm() reaches here, and setBpm() can run during boot: the shell hands a newly
     registered instrument the page's tempo the moment it registers, and CS·1 registers
     before this element is looked up. Harmless to skip — the hint is painted again by
     everything that changes it. */
  if (!swingHint) return;
  if (SW.ratio <= .5){ swingHint.textContent = "even steps"; return; }
  const beat = 60 / state.bpm;
  let step;
  if (state.motion === "pulse"){
    step = (beat * 4) / Math.max(1, PULSE.steps);
  } else {
    /* under "auto" the rate depends on the sequence length, so read it off the real voicing */
    const v = state.prog && state.prog.voicings && state.prog.voicings[0];
    step = arpStepFor(beat, v ? arpSequence(v).length : 4);
  }
  swingHint.textContent = "off-beats late by " + Math.round(step*(2*SW.ratio-1)*1000) + " ms";
}

/* ---- out ---- */
/* The two clocks: ctx.currentTime counts audio the graph has *accepted*, performance.now()
   is wall time. getOutputTimestamp pairs them at the frame actually leaving the device, so
   the base it gives already carries output latency — which is what both callers want. MIDI
   out wants notes to land when the internal voice is audible, and the phase measurement
   wants to compare what's heard against when clock pulses arrive. */
function ctxPerfBase(){
  if (ctx.getOutputTimestamp){
    const ts = ctx.getOutputTimestamp();
    if (ts && ts.contextTime != null && ts.performanceTime != null && ts.performanceTime > 0)
      return ts.performanceTime - ts.contextTime * 1000;
  }
  return performance.now() - ctx.currentTime * 1000;
}
/* AudioContext time -> performance.now() time, the domain MIDIOutput.send expects */
function perfTime(ctxTime){
  if (!ctx) return performance.now();
  return ctxPerfBase() + ctxTime * 1000;
}
/* and back the other way, for timestamping incoming clock onto the audio grid */
function ctxTime(perfMs){
  if (!ctx) return 0;
  return (perfMs - ctxPerfBase()) / 1000;
}

/* A timestamped note-off lives in the browser's queue until its moment arrives — if the
   page dies first it is never delivered and the external synth holds that note forever.
   Pads can be 8 bars (~38s at 50bpm), so only short offs are pre-scheduled; longer ones
   are held here and sent as they come due, capping the exposure to a few seconds. */
const MAX_OFF_AHEAD = 4;
const pendingOffs = [];
let offTimer = null;

function flushOffs(){
  if (!ctx) return;
  const horizon = ctx.currentTime + .25;
  for (let i = pendingOffs.length - 1; i >= 0; i--){
    const o = pendingOffs[i];
    if (o.at <= horizon){
      if (MIDI.out){ try{ MIDI.out.send([0x80 | o.ch, o.p, 0], perfTime(o.at)); }catch(e){} }
      pendingOffs.splice(i, 1);
    }
  }
  if (!pendingOffs.length && offTimer != null){ clearInterval(offTimer); offTimer = null; }
}

function sendNote(n, t, dur, vel){
  const out = MIDI.out; if (!out) return;
  const p = Math.max(0, Math.min(127, Math.round(n)));
  const v = Math.max(1, Math.min(127, Math.round(vel == null ? 96 : vel)));
  try{
    out.send([0x90 | MIDI.ch, p, v], perfTime(t));
    if (dur <= MAX_OFF_AHEAD){
      out.send([0x80 | MIDI.ch, p, 0], perfTime(t + dur));
    } else {
      pendingOffs.push({p, ch:MIDI.ch, at:t + dur});
      if (offTimer == null) offTimer = setInterval(flushOffs, 40);
    }
  }catch(e){}
}

/* Deliberately blunt: every channel, not just the selected one, because a stuck note may
   predate a channel change — or a whole browser session. */
function midiPanic(){
  pendingOffs.length = 0;
  if (offTimer != null){ clearInterval(offTimer); offTimer = null; }
  const out = MIDI.out; if (!out) return;
  try{
    if (out.clear) out.clear();          // drop everything still queued ahead of us
    for (let ch = 0; ch < 16; ch++){
      out.send([0xB0 | ch, 120, 0]);     // all sound off
      out.send([0xB0 | ch, 123, 0]);     // all notes off
      out.send([0xB0 | ch, 64, 0]);      // sustain pedal up, in case it is latching
    }
    for (let n = 0; n < 128; n++) out.send([0x80 | MIDI.ch, n, 0]);
  }catch(e){}
}

/* ---- midi learn ---- */
const MAP_KEY = "patchwork-cs1-midimap";

function midiNoteLabel(n){ return SHARPS[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1); }
function padNoteFor(slot){
  for (const [n, s] of padMap) if (s === slot) return n;
  return null;
}

function saveMap(){
  try{ localStorage.setItem(MAP_KEY,
    JSON.stringify({pads:[...padMap], ccs:[...ccMap], progs:[...progMap],
                    notes:[...patchNotes], recall:RECALL.when, inCh:MIDI.inCh})); }catch(e){}
}
function loadMap(){
  try{
    const raw = localStorage.getItem(MAP_KEY); if (!raw) return;
    const o = JSON.parse(raw) || {};
    (o.pads || []).forEach(p => padMap.set(+p[0], +p[1]));
    (o.ccs  || []).forEach(c => { if (Object.prototype.hasOwnProperty.call(P, c[1])) ccMap.set(+c[0], c[1]); });
    /* absent in maps saved before program change existed, which is why this is a separate
       key rather than a change to the shape of the two that were already there */
    (o.progs || []).forEach(p => {
      const n = +p[0];
      if (n >= 0 && n <= 127 && typeof p[1] === "string") progMap.set(n, p[1]);
    });
    (o.notes || []).forEach(p => {
      const n = +p[0];
      if (n >= 0 && n <= 127 && typeof p[1] === "string") patchNotes.set(n, p[1]);
    });
    if (["instant","bar","pattern"].indexOf(o.recall) >= 0) RECALL.when = o.recall;
    if (typeof o.inCh === "number" && o.inCh >= -1 && o.inCh < 16){
      MIDI.inCh = o.inCh;
      if (typeof midiInChSel !== "undefined" && midiInChSel) midiInChSel.value = String(o.inCh);
    }
  }catch(e){}
}

function refreshBinds(){

  Object.keys(faderCtl).forEach(id => {

}

function bindLearn(kind, num){
  const t = LEARN.target; if (!t) return;
  if (kind === "note" && t.type === "pad"){
    padMap.forEach((slot, n) => { if (slot === t.i) padMap.delete(n); });  // one note per slot
    patchNotes.delete(num);                    // a note can't be both a chord and a recall
    padMap.set(num, t.i);
  } else if (kind === "note" && t.type === "patch"){
    patchNotes.forEach((nm, n) => { if (nm === t.name) patchNotes.delete(n); });
    padMap.delete(num);
    patchNotes.set(num, t.name);
  } else if (kind === "cc" && t.type === "fader"){
    ccMap.forEach((id, c) => { if (id === t.id) ccMap.delete(c); });
    ccMap.set(num, t.id);
  } else {
    return;   // wrong message type for this target — keep waiting
  }
  saveMap();
  LEARN.target = null;
  $$(".arm").forEach(x => x.classList.remove("arm"));
  refreshBinds();
  learnSay();

/* ---- in: chord pads ---- */
const WHITE = [0,2,4,5,7,9,11];
/* white keys map to progression slots, C4 = slot 1, wrapping in every octave */
function padIndex(n){
  const w = WHITE.indexOf(((n % 12) + 12) % 12);
  if (w < 0) return -1;
  return w + (Math.floor(n / 12) - 5) * 7;
}

/* A learned map replaces the white-key default outright rather than layering on top of it:
   half-custom/half-piano would fire chords from notes you never assigned. */
function padSlot(n){
  const len = state.prog.chords.length;
  if (padMap.size) return padMap.has(n) ? padMap.get(n) % len : -1;
  const pi = padIndex(n);
  return pi < 0 ? -1 : ((pi % len) + len) % len;
}

function flashPad(i, on){
  if (on) litPads.add(i); else litPads.delete(i);
  if (!state.playing){
    const c = chordsEl.querySelectorAll(".chord")[i];   // children are .pad wrappers now
    if (c) c.classList.toggle("on", on);
  }
}

/* Arp and Pulse are patterns, not chords, so a held pad has to keep re-issuing them.
   Same lookahead trick as the transport: one shared timer tops every held pad up to a
   short horizon, rather than a timer (and drift) per pad. */
const PAD_HORIZON = .15;
let padTimer = null;
const padLooping = () => state.motion === "arp" || state.motion === "pulse";

function padTick(){
  if (!ctx || !arping.size) return;
  const horizon = ctx.currentTime + PAD_HORIZON;
  arping.forEach(a => {
    a.recs = a.recs.filter(r => active.has(r));   // drop notes that have already ended
    const amp = .35 + .65 * (a.vel / 127);
    let guard = 0;
    while (a.next < horizon && guard++ < 8){
      chordEvents(a.slot, a.next).forEach(e => {
        const g = (e.gain != null ? e.gain : VOICES[state.voice].lvl) * amp;
        a.recs.push(trigger(e.n, e.t, e.d, {bass:e.bass, gain:g, pan:e.pan, susAmt:e.susAmt}));
        sendNote(e.n, e.t, e.d, Math.round(e.vel * (a.vel / 127)));
      });
      /* the rate half of the phase correction, but not the phase half — a held pad has its
         own downbeat, set by when it was pressed, and shouldn't be dragged onto the
         transport's. It should still run at the same tempo as it, though. */
      a.next += barSeconds() * chordBars(a.slot) * (1 + (SYNC.lock ? SYNC.trim : 0));
    }
  });
}

function padOn(n, vel){
  if (!state.prog) return;
  const i = padSlot(n); if (i < 0) return;
  if (held.has(n)) padOff(n);

  const ch = state.prog.chords[i];
  const notes = state.prog.voicings[i];
  const outNotes = (state.bass ? [bassNote(ch, state.keyPc)] : []).concat(notes);

  if (padLooping()){
    ensureAudio();
    const a = {slot:i, vel, recs:[], next:ctx.currentTime + .02};
    arping.set(n, a);
    held.set(n, {recs:a.recs, outNotes, slot:i, arp:true});
    if (padTimer == null) padTimer = setInterval(padTick, 25);
    padTick();                    // don't wait a tick to start — this is a performance control
    flashPad(i, true);
    return;
  }

  /* Hold and Strum are sustained chords: one gated voicing that rings until note-off */
  if (MIDI.out){
    try{ outNotes.forEach(p => MIDI.out.send([0x90 | MIDI.ch, p, vel])); }catch(e){}
  }
  const recs = [];
  {
    ensureAudio();
    const amp = .35 + .65 * (vel / 127);
    const spread = notes.length > 1 ? 1.2 / (notes.length - 1) : 0;
    const off = state.motion === "strum" ? .045 : .012;
    if (state.bass){
      recs.push(trigger(bassNote(ch, state.keyPc), ctx.currentTime, HOLD_MAX,
        {bass:true, gain:bassGain() * amp, susAmt:P.bassSus}));
    }
    notes.forEach((nn, k) => recs.push(
      trigger(nn, ctx.currentTime + k*off, HOLD_MAX, {pan:-0.6 + k*spread, gain:VOICES[state.voice].lvl * amp})
    ));
  }
  held.set(n, {recs, outNotes, slot:i});
  flashPad(i, true);
}

function padOff(n){
  const h = held.get(n); if (!h) return;
  held.delete(n);

  const a = arping.get(n);
  if (a){
    arping.delete(n);
    if (!arping.size && padTimer != null){ clearInterval(padTimer); padTimer = null; }
    a.recs.forEach(r => releaseRec(r));
    if (MIDI.out){
      try{
        h.outNotes.forEach(p => MIDI.out.send([0x80 | MIDI.ch, p, 0]));
        /* the lookahead may already have queued note-ons past this instant; sweep again
           once the horizon has passed so nothing is left hanging on the external synth */
        setTimeout(() => {
          if (!MIDI.out) return;
          try{ h.outNotes.forEach(p => MIDI.out.send([0x80 | MIDI.ch, p, 0])); }catch(e){}
        }, (PAD_HORIZON + .12) * 1000);
      }catch(e){}
    }
  } else {
    if (MIDI.out){
      try{ h.outNotes.forEach(p => MIDI.out.send([0x80 | MIDI.ch, p, 0])); }catch(e){}
    }
    h.recs.forEach(r => releaseRec(r));
  }

  /* only clear the highlight if no other held key maps to the same slot */
  let stillHeld = false;
  held.forEach(o => { if (o.slot === h.slot) stillHeld = true; });
  if (!stillHeld) flashPad(h.slot, false);
}

function allPadsOff(){ Array.from(held.keys()).forEach(padOff); }

/* ---- in: clock ---- */
let clockLast = 0, lastBpmPaint = 0, clockWatch = null;
const clockTimes = [];

/* Clock source follows the cable now: the first 0xF8 takes over the tempo, and when the
   pulses stop the transport goes back to its own clock. Nothing to remember to flip. */
function setSync(mode){
  if (MIDI.sync === mode) return;
  MIDI.sync = mode;
  if (mode === "ext"){
    if (clockWatch == null){
      clockWatch = setInterval(() => {
        /* a bar at 50bpm is ~4.8s, but clock pulses are 24 per beat — a second of silence
           means the source really has stopped, not that it's between beats */
        if (performance.now() - clockLast > 1000) setSync("int");
      }, 250);
    }
  } else {
    if (clockWatch != null){ clearInterval(clockWatch); clockWatch = null; }
    clockTimes.length = 0;
    phaseReset();     // the grid is ours again; the old error means nothing
  }
  updateMeta();
  if (MIDI.access) describe();
}

/* ---- phase ----
   Tempo follow alone is an open loop: whatever the tempo estimate gets wrong, position
   error integrates and never comes back. This closes it. Every pulse is a statement about
   where the external beat grid is, so compare the transport's own position against it and
   feed the difference back into the length of the next chord.

   Error is wrapped to the nearest WHOLE BEAT, not the nearest pulse. Output latency and
   whatever Offset is dialled in are a constant tens of ms; half a pulse is 10ms at 120bpm,
   so locking to the nearest pulse would let that constant hop between neighbours and
   dither. Half a beat is 250ms — comfortably clear of it. Bar-level alignment is Start's
   job, not the loop's. */
const PHASE = {
  alpha: .05,     // per-pulse EMA — ~20 pulses, under a beat, well below the jitter
  gain: .25,      // fraction of the remaining error taken out per chord
  ki: .05,        // and the rate correction, see `trim` below
  maxAdj: .01,    // ...and never more than 10ms, or 2% of a chunk, whichever is smaller.
                  // 10ms on a 2s bar is 0.5%, well under audible, and pulls a worst-case
                  // quarter-beat start error in about half a minute. 4ms was inaudible too
                  // but took minutes; 20ms bought little speed for double the overshoot.
  maxTrim: .005,  // 5000ppm, an order past any real crystal mismatch
  maxErr: .45     // beats; beyond this the estimate is near the wrap and not trustworthy
};
function phaseReset(){
  SYNC.pulse = 0; SYNC.err = 0; SYNC.have = false; SYNC.trim = 0;
  SYNC.hist.length = 0;
  Patchwork.clock.setRate(1);
}
/* One pulse arrived at wall time `now`: where is the transport against it? */
function phaseSample(now){
  if (!ctx || !state.playing || !state.prog) return;
  const beat = beatSeconds();
  if (!(beat > 0)) return;
  /* both sides in beats, so the difference wraps at 1 */
  const diff = beatsAt(ctxTime(now)) - SYNC.pulse / 24;
  const wrapped = diff - Math.round(diff);
  const err = wrapped * beat;
  if (!SYNC.have){ SYNC.err = err; SYNC.have = true; }
  else SYNC.err += PHASE.alpha * (err - SYNC.err);

  /* One sample a second, two minutes deep — enough to fit a slope through, short enough
     that it forgets a transient instead of averaging it in forever. */
  const h = SYNC.hist;
  if (!h.length || now - h[h.length - 1].t > 1000){
    h.push({t:now, e:SYNC.err});
    if (h.length > 120) h.shift();
  }
}
/* The length to actually give the next chord. Returns `dur` untouched whenever the loop
   shouldn't be closed — free-running, clock ignored, no estimate yet, or an error big enough
   that it's a re-sync rather than drift, where a lurch would be worse than staying put.

   Two terms, because there are two different faults to correct:
     nudge  proportional — pulls an existing phase error back to zero
     trim   integral — the disturbance is a RATE error (tempo is measured off
            performance.now() but spent against ctx.currentTime, and those are two
            different crystals), and proportional feedback can only cancel a rate by
            standing at a permanent offset. Simulated at 900ppm skew that offset is 7ms;
            the trim absorbs the rate instead and leaves the error itself at zero. */
function phaseAdjust(dur){
  if (!SYNC.lock || !SYNC.have || !MIDI.clockOn || MIDI.sync !== "ext") return dur;
  if (Math.abs(SYNC.err) > PHASE.maxErr * beatSeconds()) return dur;
  const cap = Math.min(dur * .02, PHASE.maxAdj);
  const want = SYNC.err * PHASE.gain;
  const nudge = Math.max(-cap, Math.min(cap, want));
  /* Anti-windup: while the nudge is clamped, the loop is correcting as fast as it is
     allowed to rather than as fast as the error asks, and the integrator can't tell those
     apart — it would wind up on the way in and have to unwind past zero on the far side.
     Measured as a 31ms overshoot on a 119ms pull-in. So integrate only when not saturated. */
  if (Math.abs(want) <= cap)
    SYNC.trim = Math.max(-PHASE.maxTrim,
                Math.min(PHASE.maxTrim, SYNC.trim + PHASE.ki * SYNC.err / dur));
  /* publish the rate part so every instrument on the page runs at the corrected rate,
     not just this one — see shell/clock.js for why the nudge stays here */
  Patchwork.clock.setRate(1 + SYNC.trim);
  return dur * (1 + SYNC.trim) + nudge;
}
/* Drift is the slope, not the offset: a constant error is what Offset exists for. Fitted
   over the trailing window rather than measured against a fixed starting point, so that
   whatever the error was doing a few minutes ago stops counting — an endpoint reference
   reported a pull-in transient as a -68 ms/min drift long after the loop had settled. */
function phaseDrift(){
  const h = SYNC.hist, n = h.length;
  if (n < 20 || h[n - 1].t - h[0].t < 30000) return null;
  let mx = 0, my = 0;
  for (const p of h){ mx += p.t; my += p.e; }
  mx /= n; my /= n;
  let num = 0, den = 0;
  for (const p of h){ num += (p.t - mx) * (p.e - my); den += (p.t - mx) ** 2; }
  return den ? num / den * 60000 * 1000 : null;   // seconds per ms -> ms per minute
}

/* Tempo comes from a long window rather than smoothed single intervals. One 24ppqn pulse
   is ~20ms and arrives jittery — over the bridge on iOS it's one call per message — so
   averaging pairs gives a noisy figure. Measuring across up to four beats is a duration
   ratio, and the jitter on the two endpoints divides down by the span. */
function onClock(){
  if (!MIDI.clockOn) return;
  const now = performance.now();
  setSync("ext");
  clockLast = now;

  phaseSample(now);
  SYNC.pulse++;

  clockTimes.push(now);
  if (clockTimes.length > 97) clockTimes.shift();     // four beats at 24ppqn

  if (clockTimes.length >= 25 && now - lastBpmPaint > 200){
    lastBpmPaint = now;
    const span = clockTimes.length - 1;
    const perPulse = (clockTimes[span] - clockTimes[0]) / span;   // ms
    const bpm = 60000 / (perPulse * 24);
    if (bpm >= 40 && bpm <= 250) setBpm(bpm, true);
    paintPhase();
  }
}

function onMidi(e){
  const d = e.data; if (!d || !d.length) return;
  const s = d[0];
  ledBlink();
  if (s === 0xF8) return onClock();
  if (s === 0xFA || s === 0xFB){                       // start / continue
    /* Start usually arrives just before the first clock pulse, so requiring ext sync
       already to be engaged meant the very message that should begin playback got
       dropped. Following the clock at all is enough. */
    if (MIDI.clockOn){
      setSync("ext");
      if (state.playing) stopPlay();
      startPlay();
    }
    return;
  }
  if (s === 0xFC){                                     // stop
    if (MIDI.clockOn && state.playing) stopPlay();
    return;
  }
  if (s >= 0xF0) return;
  /* Channel filter. Everything above this point is system-realtime, which has no channel,
     so clock and start/stop are unaffected by it. */
  if (MIDI.inCh >= 0 && (s & 0x0F) !== MIDI.inCh) return;
  const type = s & 0xF0;
  if (type === 0x90 && d[2] > 0){
    if (LEARN.on && LEARN.target){ bindLearn("note", d[1]); return; }
    /* a note assigned to a patch is consumed by it — it does not also sound a chord */
    if (patchNotes.has(d[1])) return queueRecall(patchNotes.get(d[1]), midiNoteLabel(d[1]));
    padOn(d[1], d[2]);
  }
  else if (type === 0x80 || (type === 0x90 && d[2] === 0)){
    if (patchNotes.has(d[1])) return;
    padOff(d[1]);
  }
  else if (type === 0xB0){
    if (d[1] === 123 || d[1] === 120) return allPadsOff();
    if (d[1] > 119) return;                      // channel-mode messages aren't controls
    if (LEARN.on && LEARN.target){ bindLearn("cc", d[1]); return; }
    applyCC(d[1], d[2]);
  }
  /* program change carries a single data byte, so the program is d[1] and there is no d[2] */
  else if (type === 0xC0) recallProgram(d[1]);
}

function recallProgram(prog){
  const name = progMap.get(prog);
  if (name) queueRecall(name, "Program " + prog);
}

/* Ask for a patch. Whether it lands now or on the next seam is RECALL.when — the request
   is the same either way, so both the note trigger and program change come through here. */
function queueRecall(name, why){
  const store = loadStore();
  if (!store[name]){                              // assigned to a patch since deleted
    for (const [p, n] of [...progMap]) if (n === name) progMap.delete(p);
    for (const [n, pn] of [...patchNotes]) if (pn === name) patchNotes.delete(n);
    saveMap(); refreshPatchList(patchSel.value); refreshBinds();
    return;
  }
  /* Nothing is playing, so there is no seam to wait for. */
  if (RECALL.when === "instant" || !state.playing) return applyPatch(name, why);
  RECALL.pending = {name, why};
  patchSay(why + " → <b>" + name + "</b> queued for the "
    + (RECALL.when === "pattern" ? "end of the pattern" : "next chord") + ".");
}

/* Applied from inside tick(), immediately before the chord at the seam is scheduled, so the
   new progression is what gets played from that boundary on. */
function takePending(){
  if (!RECALL.pending) return;
  if (RECALL.when === "pattern" && nextIndex !== 0) return;   // wait for the loop point
  const {name, why} = RECALL.pending;
  RECALL.pending = null;
  applyPatch(name, why);
}

function applyPatch(name, why){
  const store = loadStore();
  const patch = store[name];
  if (!patch) return;
  /* A patch remembers the tempo it was saved at, which would fight an external clock for
     the fraction of a second before the follower pulls it back. Keep the clock's tempo. */
  const extBpm = MIDI.sync === "ext" ? state.bpmExact : null;
  try{ restore(patch); }
  catch(err){ patchSay(why + " couldn't load <b>" + name + "</b>.", true); return; }
  if (extBpm != null) setBpm(extBpm, true);

  /* The new progression may be shorter than the one playing, and the transport is mid-flight
     with an index into the old one. chordEvents() returns nothing for an index past the end,
     i.e. a silent bar, so fold it back into range. */
  if (state.playing && state.prog && state.prog.chords.length)
    nextIndex = nextIndex % state.prog.chords.length;

  patchName.value = name;
  refreshPatchList(name);
  refreshBinds();
  patchSay(why + " → <b>" + name + "</b>.");
}

/* ---- ports & status ---- */
let ledT = 0;
function ledBlink(){
  const now = performance.now();
  if (now - ledT < 90) return;
  ledT = now;
  ledEl.classList.add("lit");
  setTimeout(() => ledEl.classList.remove("lit"), 80);
}

function say(msg, bad){
  midiNoteEl.innerHTML = msg;
  midiNoteEl.classList.toggle("bad", !!bad);
  ledEl.classList.toggle("err", !!bad);
  ledEl.classList.toggle("ready", !bad && !!MIDI.in);
}

function fillSel(sel, ports, keepId){
  sel.innerHTML = '<option value="">— none —</option>';
  ports.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.name || p.id;
    sel.appendChild(o);
  });
  sel.value = (keepId && ports.some(p => p.id === keepId)) ? keepId : "";
}

function ports(kind){ return MIDI.access ? Array.from(MIDI.access[kind].values()) : []; }

function fillPorts(){
  fillSel(midiInSel, ports("inputs"), MIDI.in && MIDI.in.id);
  fillSel(midiOutSel, ports("outputs"), MIDI.out && MIDI.out.id);
}

function describe(){
  const ins = ports("inputs").length, outs = ports("outputs").length;
  say(ins + " input" + (ins === 1 ? "" : "s") + " · " + outs + " output" + (outs === 1 ? "" : "s")
    + " — white keys trigger chord slots (C4 = slot 1) and wrap in every octave. "
    + (MIDI.inCh < 0 ? "Listening on <b>every channel</b>. "
                     : "Listening on <b>channel " + (MIDI.inCh + 1) + "</b> only. ")
    + (MIDI.sync === "ext"
        ? "<b>Following external clock.</b> Use Offset to line it up against your gear."
        : "Incoming MIDI clock is followed automatically."));
}

/* The port belongs to the page, not to this panel — see shell/midi.js. Assigning
   onmidimessage here is what made the two instruments steal it from each other. */
function bindInput(){
  allPadsOff();
  MIDI.in = Patchwork.midi.select(midiInSel.value);
  ledEl.classList.toggle("ready", !!MIDI.in && !ledEl.classList.contains("err"));
}
/* Called when the page's input changes, including from the other panel. */
function followInput(pt){
  MIDI.in = pt;
  if (midiInSel.value !== (pt ? pt.id : "")) midiInSel.value = pt ? pt.id : "";
  ledEl.classList.toggle("ready", !!pt && !ledEl.classList.contains("err"));
}

function bindOutput(){
  midiPanic();                      // silence whatever the old port is holding
  MIDI.out = midiOutSel.value ? ports("outputs").find(p => p.id === midiOutSel.value) || null : null;
}

$("#clockEn").addEventListener("click", e => {

  MIDI.clockOn = b.dataset.c === "on";
  $("#clockEn").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  if (!MIDI.clockOn) setSync("int");     // drop straight back to the internal clock
});

const phaseOut = $("#phaseOut");
function setClockLock(on){
  SYNC.lock = !!on;
  $("#clockLock").querySelectorAll("button")
    .forEach(x => x.classList.toggle("on", (x.dataset.l === "on") === SYNC.lock));
  paintPhase();
}
$("#clockLock").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setClockLock(b.dataset.l === "on");
  /* Measure the new regime from here — the drift figure is a slope, and fitting it across
     the moment the loop closed would report neither the open- nor the closed-loop number. */
  SYNC.hist.length = 0;
  SYNC.trim = 0;
});
/* Live phase error, and the drift slope once there's enough window to mean anything. */
function paintPhase(){
  if (MIDI.sync !== "ext" || !SYNC.have){ phaseOut.textContent = "—"; return; }
  const ms = SYNC.err * 1000, d = phaseDrift();
  phaseOut.textContent = (ms > 0 ? "+" : "") + ms.toFixed(1) + " ms"
    + (d == null ? "" : "  ·  " + (d > 0 ? "+" : "") + d.toFixed(0) + "/min");
}

const offOut = $("#offOut");
function setClockOffset(ms){
  SYNC.offsetMs = Math.max(-200, Math.min(200, Math.round(ms / 5) * 5));
  offOut.textContent = (SYNC.offsetMs > 0 ? "+" : "") + SYNC.offsetMs + " ms";
}
$("#offDown").addEventListener("click", () => setClockOffset(SYNC.offsetMs - 5));
$("#offUp").addEventListener("click", () => setClockOffset(SYNC.offsetMs + 5));
setClockOffset(0);
setClockLock(false);

$("#panic").addEventListener("click", () => {
  if (state.playing) stopPlay();   // no point silencing if the sequencer refills it
  allPadsOff();
  killAll();
  midiPanic();
  say("Panic sent — all sound off, all notes off and sustain up on all 16 channels.");
});

$("#learn").addEventListener("click", () => setLearn(!LEARN.on));
$("#clearMap").addEventListener("click", () => {
  padMap.clear(); ccMap.clear(); patchNotes.clear();
  saveMap(); refreshBinds();
  LEARN.target = null;
  $$(".arm").forEach(x => x.classList.remove("arm"));
  say("Map cleared — pads are back to white keys from C4, faders are mouse-only.");
});

midiInSel.addEventListener("change", bindInput);
midiOutSel.addEventListener("change", bindOutput);
midiChSel.addEventListener("change", () => { midiPanic(); MIDI.ch = parseInt(midiChSel.value, 10); });


function initMidi(){
  if (!navigator.requestMIDIAccess){
    /* Every iOS browser is WebKit underneath, so this is a platform limit rather than a
       browser choice — naming Safari 18 here misleads anyone reading it on a phone. */
    say(IS_IOS
      ? "Web MIDI isn't available on iOS or iPadOS — every browser there uses WebKit, so "
        + "switching browsers won't help. Everything else works; MIDI needs a desktop."
      : "Web MIDI isn't available in this browser. Chrome and Edge support it, and Firefox "
        + "prompts for permission.", true);
    return;
  }
  if (!window.isSecureContext){
    say("Web MIDI needs a secure context. Serve this file over <code>localhost</code> "
      + "rather than opening it with <code>file://</code>.", true);
    return;
  }
  Patchwork.midi.route("cs1", onMidi, pt => {
    fillPorts(); followInput(pt); bindOutput(); describe();
  });
  Patchwork.midi.open().then(a => {
    MIDI.access = a;
    fillPorts();
    /* Only claim the default port if nothing has claimed one yet — otherwise the second
       instrument to boot rebinds the page's input out from under the first. */
    const ins = ports("inputs");
    if (!Patchwork.midi.port && ins.length){ midiInSel.value = ins[0].id; bindInput(); }
    else followInput(Patchwork.midi.port);
    describe();
  }).catch(err => {
    say("MIDI access was denied or failed (" + ((err && err.name) || "error") + ").", true);
  });
}

/* USB audio interfaces (EP-133 et al) are class-compliant devices, so CoreAudio already
   exposes them — this just points the graph at one for output and taps one for input. */
const audioOutSel = $("#audioOut"),
      audioNoteEl = $("#audioNote"), audioLed = $("#audioLed");


/* reset synchronously — a hidden tab fires no frames, so cleanup can't wait for one */


/* the numbers that decide whether the browser path is good enough for live playing */
function ioStats(){
  const el = $("#ioStats");
  if (!ctx){ el.innerHTML = ""; return; }
  /* first thing to read when there's no sound — on iOS this sits at "suspended" until a
     gesture, and drops to "interrupted" after a call or an app switch */
  const bits = ["audio <b" + (ctx.state === "running" ? ">" : " style=\"color:#e8b23a\">") + ctx.state + "</b>",
                "rate <b>" + (ctx.sampleRate / 1000).toFixed(1) + " kHz</b>"];
  if (ctx.baseLatency != null)   bits.push("buffer <b>" + (ctx.baseLatency * 1000).toFixed(1) + " ms</b>");
  if (ctx.outputLatency != null) bits.push("output <b>" + (ctx.outputLatency * 1000).toFixed(1) + " ms</b>");
  el.innerHTML = bits.map(b => "<span>" + b + "</span>").join("");
}

function ioSay(msg, bad){
  audioNoteEl.innerHTML = msg;
  audioNoteEl.classList.toggle("bad", !!bad);
  audioLed.classList.toggle("err", !!bad);
}

function fillDev(sel, devs, noneLabel, keep, fallback){
  sel.innerHTML = "";
  const n = document.createElement("option");
  n.value = ""; n.textContent = noneLabel;
  sel.appendChild(n);
  devs.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || (fallback + " " + (i + 1));
    sel.appendChild(o);
  });
  sel.value = devs.some(d => d.deviceId === keep) ? keep : "";
}

async function scanDevices(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices){
    /* Not a failure on iOS — WebKit exposes no device picker because routing is a system
       concern there. Output already follows the system device, so saying "can't
       enumerate" reads as broken when it's working exactly as the platform intends. */
    ioSay(IS_IOS
      ? "iOS routes audio at the system level, so there's no in-page picker. Output follows "
        + "the system output — choose the EP-133 in Control Centre and this follows it."
      : "This browser can't enumerate audio devices.", !IS_IOS);
    return;
  }
  /* device labels stay blank until mic permission is granted once */
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t => t.stop());
  }catch(e){}
  const devs = await navigator.mediaDevices.enumerateDevices();
  const outs = devs.filter(d => d.kind === "audiooutput");
  const ins  = devs.filter(d => d.kind === "audioinput");
  fillDev(audioOutSel, outs, "System default", audioOutSel.value, "Output");
  const sinkOk = !ctx || typeof ctx.setSinkId === "function";
  ioSay(outs.length + " output" + (outs.length === 1 ? "" : "s") + " · "
      + ins.length + " input" + (ins.length === 1 ? "" : "s")
      + (sinkOk ? ". Pick your interface for either direction."
                : ". Output routing needs Chrome 110+; input still works."), !sinkOk);
  audioLed.classList.add("ready");
  ioStats();
}

async function setSink(id){
  initAudio();
  if (typeof ctx.setSinkId !== "function"){
    ioSay("Output routing needs <code>AudioContext.setSinkId</code> — Chrome 110+.", true);
    return;
  }
  try{
    await ctx.setSinkId(id || "");
    ioStats();   // outputLatency changes with the device
    ioSay("Output → " + audioOutSel.selectedOptions[0].textContent);
  }catch(e){
    ioSay("Couldn't switch output: " + ((e && e.name) || e), true);
  }
}


/* rAF is paused while the tab is hidden; pick the meter back up when it returns */
/* Also called from the iOS host when the app returns to the foreground, since a WKWebView
   doesn't reliably get a visibilitychange for that. */
window.__patchworkResume = function(){
  if (!ctx) return;
  if (ctx.state !== "running"){
    const p = ctx.resume();
    if (p && p.catch) p.catch(() => {});
  }
  ioStats();
};

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  /* was gated on state.playing, which meant returning to a stopped app left the context
     interrupted and the pads silent until something else happened to resume it */
  window.__patchworkResume();
});

/* Safety net: any tap re-resumes an existing context. Deliberately does not create one —
   audio should still only start when the player actually asks for a sound. */
["pointerdown","touchend"].forEach(ev => document.addEventListener(ev, () => {
  if (ctx && ctx.state !== "running"){
    const p = ctx.resume();
    if (p && p.catch) p.catch(() => {});
  }
}, {passive:true}));



$("#scan").addEventListener("click", scanDevices);
audioOutSel.addEventListener("change", () => setSink(audioOutSel.value));
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener){
  navigator.mediaDevices.addEventListener("devicechange", () => {
    if (audioLed.classList.contains("ready")) scanDevices();
  });
}
