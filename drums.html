<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harvest Jam Session — DR·1 — drum machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Saira+Semi+Condensed:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One token set for every instrument.

   These were already shared: MS·1's stylesheet copied CS·1's values verbatim, with a
   comment saying why — two synths with the same grey and different accents read as one
   product line. All 12 common tokens matched byte for byte, so merging them here loses
   nothing and removes the chance of the two drifting.

   Instrument-specific tokens sit alongside rather than in scopes of their own: none of
   them collide, and there is no cost to a panel seeing a token it does not use. */
:root{
  /* --- CS·1 --- */
  --panel:#333a3f;
  --panel-hi:#3e464c;
  --panel-lo:#262c31;
  --edge:#1b2024;
  --silk:#c6cdd2;
  --silk-dim:#828d95;
  --paper:#e7e2d5;
  --paper-dim:#d3cec1;
  --ink:#232b31;
  --cap-red:#e04b2f;
  --cap-yellow:#e8b23a;
  --mint:#63d6b0;
  --slot:#1d2226;

  /* --- MS·1 adds --- */
  /* CS·1 is a red instrument; MS·1 is a blue one. That, the knobs and the stripes are
     the whole model tell — the panel itself is deliberately unchanged. */
  --accent:#4a8fd6;
  --accent-hi:#6ea9e6;
  --accent-lo:#2f6fb5;
  --accent-ink:#0b1f31;
  /* section stripes, read left-to-right down the signal path */
  --stripe-mod:#8b74d6;
  --stripe-osc:var(--accent);
  --stripe-flt:var(--cap-yellow);
  --stripe-amp:#9aa5ac;
  --stripe-voc:#d67ab1;    /* vocoder — its own identity, not a variant of the filter */
  --stripe-bass:#d9884a;   /* bass pedals */
  /* named here rather than repeated as literals the way CS·1 does */
  --groove:#12161a;
  --groove-hi:#20262a;
  --groove-deep:#0b0e10;
  --cap-hi:#5b656b;
  --cap-lo:#394247;
  --cap-edge:#14181b;
  --read:#aeb8be;
  --read-hi:#a9b3b9;
  --read-dim:#5f696f;
  --chrome-hi:#eef3f5;
  --field:#dfe6ea;
}
*{box-sizing:border-box;margin:0;padding:0}
/* height:100% on body would pin it to exactly one viewport; .unit then stretches to that
   fixed height and its overflow:hidden clips everything below the fold, unreachably. */
html{height:100%}
body{
  background:#1a1e21;
  background-image:radial-gradient(120% 90% at 50% 0%,#2b3237 0%,#15181b 100%);
  color:var(--silk);
  font-family:"Saira Semi Condensed",system-ui,sans-serif;
  min-height:100%;
  padding:18px 14px 40px;
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-font-smoothing:antialiased;
}
/* Panel chrome a new instrument can build on.

   CS·1 and MS·1 were written as separate whole pages and independently grew the same
   controls — the plate, the buttons, the fields, the LEDs. 38 of their rules are
   byte-identical, which is what happens when one is copied from the other and neither is
   edited after. DR·1 needs those rules to look like a Patchwork panel at all, and a
   third hand-written copy is the worst of the available options.

   ⚠️ These are ALSO still present in cs1/panel.css and ms1/panel.css, deliberately.
   Deleting them there and relying on this file broke both apps: 8 changed computed-style
   signatures in CS·1 and 22 in MS·1. @scope adds no specificity, so source order decides
   every equal-specificity conflict, and lifting a rule to the top of the cascade flips
   any conflict that previously resolved the other way. Extracting safely means proving no
   such conflict exists for each rule, which is a bigger job than adding an instrument.

   So this file loads FIRST and the instrument sheets override it with identical values —
   CS·1 and MS·1 cannot change, by construction, and DR·1 gets a panel. The duplication
   is real and is the honest price; Phase 6 rewrites these panels for the live faces and
   is the place to resolve it. */
@scope (.unit) {

.brand{font-family:"Saira Semi Condensed";font-weight:600;font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:#e4e9ec;line-height:1}
.model{font-family:"DM Mono";font-size:10.5px;letter-spacing:.14em;color:var(--silk-dim);margin-top:6px;text-transform:uppercase}
.screws{display:flex;gap:8px;opacity:.5;flex:0 0 auto;align-items:center;
  align-self:center;margin-top:2px}
.screw{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6d777d,#2c3236);box-shadow:0 1px 0 rgba(255,255,255,.12)}
.card-title{font-family:"DM Mono";font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5d6469}
.card-meta{font-family:"DM Mono";font-size:11px;letter-spacing:.06em;color:#3b464e}
.card-title em{font-style:normal;color:#8a6157;margin-left:9px}

/* ---------- transport ---------- */
.transport{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin:16px 0 4px}
.btn{
  font-family:"Saira Semi Condensed";font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(180deg,#4a5359,#394247);
  color:#e6ebee;border:1px solid var(--edge);border-radius:5px;
  padding:11px 16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.13) inset,0 2px 0 #1c2124;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.btn.play{min-width:112px}
.btn.play.on{background:linear-gradient(180deg,#79e6c3,var(--mint));border-color:#1f7a61;color:#0d2c24}

/* ---------- selects & tempo ---------- */
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 118px;min-width:0}
label,.silk{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--silk-dim);font-weight:500}
input[type="text"]::placeholder{color:#5a646a}
.patch-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
.tempo button{width:32px;flex:none;background:none;border:none;color:var(--silk-dim);font-size:17px;cursor:pointer;padding:8px 0;font-family:inherit}
.tempo button:hover{color:#fff}
.tempo output{flex:1;text-align:center;font-family:"DM Mono";font-size:15px;color:var(--mint);letter-spacing:.04em}
/* ---------- segmented buttons ----------
   ⚠️ Only `.seg button` was here, so BS·1, DR·1, VC·1 and LP·1 got the button and nothing
   else: no container, and — the part that mattered — no `.on`. Their selected option was
   byte-identical to the unselected ones, measured, so those segments silently worked and
   showed you nothing. CS·1 and MS·1 were written as whole pages and had all of this in
   their own sheets, which is exactly why it was never noticed.

   Added here rather than copied a fourth time, and their copies STAY: this file loads
   first, so CS·1 and PM·1 override every rule below with their own and cannot change. That
   is the arrangement the header of this file describes, and the reason it exists. */
.seg{display:inline-flex;flex-wrap:wrap;gap:1px;background:var(--groove);border:1px solid var(--groove);
  border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.5) inset}
.seg button{
  font-family:"Saira Semi Condensed";font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--slot);border:none;color:var(--silk-dim);padding:8px 11px;cursor:pointer;
}
.seg button.on{background:linear-gradient(180deg,#4c565c,#3b444a);color:var(--chrome-hi)}
.seg button:hover{color:var(--chrome-hi)}
/* CS·1 has no `.seg.sm` element, so this cannot reach it — the other five use it. */
.seg.sm button{padding:6px 8px;font-size:10px;letter-spacing:.1em}
.step:hover{background:#2b3339}
.step.now{outline:2px solid var(--mint);outline-offset:1px}
.hfader .hlab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--silk-dim)}
.hfader .bind{font-family:"DM Mono";font-size:9px;color:var(--cap-yellow)}
.hfader.dragging .hcap{box-shadow:0 0 0 1px var(--mint),0 2px 3px rgba(0,0,0,.55)}
.hfader.arm{box-shadow:0 0 0 2px var(--cap-yellow) inset}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--silk-dim);margin-top:14px}

/* ---------- midi & audio i/o ---------- */
.sect{margin-top:20px;border-top:1px solid rgba(0,0,0,.4);box-shadow:0 -1px 0 rgba(255,255,255,.05);padding-top:16px}
.sect-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.led.ready{background:#2f6b5a}
.led.err{background:var(--cap-red)}
.led.lit{background:var(--mint);box-shadow:0 0 7px var(--mint)}
.note{font-family:"DM Mono";font-size:10px;letter-spacing:.04em;color:#6d777e;line-height:1.75;margin-top:14px}
.note.bad{color:#c98a7a}

/* ---------- midi learn ---------- */
.btn.sm{padding:8px 12px;font-size:11px;letter-spacing:.12em}
.btn.learn.on{background:linear-gradient(180deg,#f0c45a,var(--cap-yellow));border-color:#8a6a15;color:#2f2405}
.btn.panic{background:linear-gradient(180deg,#ec6146,var(--cap-red));border-color:#8c2a17;color:#fff2ee}
/* ---------- live faces ----------
   A face hides the blocks an instrument does not mark as worth having while playing.
   Everything hidden is still in the DOM and still bound — see shell/faces.js. */
:scope.face > :not([data-face]){display:none}
/* ...and data-deep trims INSIDE a block the face keeps, so a face can carry the useful
   half of a row — the patch selector without its MIDI-trigger plumbing — rather than
   having to take all of it or none. */
.face-toggle{margin-left:auto;align-self:flex-start}
/* Arming reads red, the same red the row buttons turn when anything is armed, so the two
   halves of one gesture are the same colour in both places. */
.arm-toggle{align-self:flex-start;flex:0 0 auto}
.arm-toggle.on{
  background:linear-gradient(180deg,#ec6146,var(--cap-red));
  border-color:#8c2a17;color:#fff2ee;
}
/* Who is holding this instrument, in a jam. Mint for you, yellow for somebody else — the
   studio's own words for "this is yours to move" and "this is waiting on someone". */
.owner-tag{align-self:flex-start;flex:0 0 auto;min-width:52px}
.owner-tag.mine{border-color:#2f8f74;color:var(--mint)}
.owner-tag.theirs{border-color:#8a6a15;color:var(--cap-yellow)}
.owner-tag[hidden]{display:none}
/* The plate is a flex row ending in the screws; the toggle sits before them. */
:scope.face .plate,:scope .plate{align-items:center}
:scope.face [data-deep]{display:none}
/* ...and `data-hosted` marks a control the PAGE owns once there is a page to own it — the
   tempo, the metronome. It comes out whenever the panel is hosted alongside others; see
   shell/boot.js. Not tied to face mode: six copies of one control are as redundant on the
   full panels as they are on the faces, and a standalone build keeps its own because
   nothing else is there to hold it. */
:scope.hosted [data-hosted]{display:none}

/* ---------- the plate ----------
   Only CS·1 and PM·1 ever defined this, so on every other panel the header had no layout
   at all and the injected Panel button fell to its own line. One definition here, and the
   button sits in the same place on all of them.

   The brand is gone from the plate — it is the page's name, not each module's, and six
   copies of it down a rack is six times less useful than one at the top. What is left is
   the model, which is what actually tells the panels apart. */
.plate{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;flex-wrap:nowrap;margin-bottom:14px;
}
/* flex-start, not center: PM·1's model wraps to two lines on a narrow panel and centring
   pushed its button 19px lower than everyone else's. The button belongs at the top right
   of the plate on every panel, which is where CS·1 had it. */
.plate > .model{flex:1 1 auto;min-width:0}
.model{
  font-family:"Saira Semi Condensed",system-ui,sans-serif;
  font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--silk);margin-top:0;line-height:1;
}
.face-toggle{margin-left:auto;align-self:flex-start}
}
/* Everything below is scoped to this instrument's panel. @scope rather than nesting
   because it adds no specificity, so the relative weight of every rule inside is exactly
   what it was when this was a whole page to itself. */
@scope (.unit.dr1) {
/* DR·1 owns only what the shared chrome does not: the lane grid, and a violet accent so
   the three panels are told apart by colour the way CS·1 and MS·1 already are. */
:scope{
  --dr-accent:#8b74d6;
  --dr-accent-hi:#a692e4;
  --dr-accent-lo:#6b56b0;
  --dr-accent-ink:#150e2b;
  width:100%;max-width:760px;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 22%,var(--panel-lo));
  border:1px solid var(--edge);
  border-radius:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 22px 50px rgba(0,0,0,.55);
  padding:20px 18px 24px;
  position:relative;overflow:clip;
}
:scope::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
}
:scope>*{position:relative;z-index:1}

.rule{height:1px;background:linear-gradient(90deg,transparent,var(--dr-accent),transparent);
  opacity:.55;margin:12px 0 16px}
.screw{width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#68727a,#2b3237 68%,#171b1e);
  box-shadow:0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.5) inset}

.transport{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.tempo{display:flex;align-items:center;background:var(--slot);border:1px solid var(--groove);
  border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.5) inset;overflow:hidden}
.tempo button{background:none;border:0;color:var(--silk-dim);font-size:15px;
  padding:8px 12px;cursor:pointer;font-family:inherit}
.tempo button:hover{color:var(--silk)}
.tempo span{font-family:"DM Mono";font-size:13px;color:var(--mint);min-width:38px;
  text-align:center;font-variant-numeric:tabular-nums}

.sect{margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.4);
  box-shadow:0 -1px 0 rgba(255,255,255,.05)}
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.patrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.knobrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.knobrow .hfader{flex:1 1 150px}

/* ---- the lanes ----
   Name, then sixteen pads. Two rows of eight on a narrow panel, because sixteen across
   at this width gives pads too small to hit — the same call CS·1's grid already made. */
.lanes{display:flex;flex-direction:column;gap:5px}
.lane{display:flex;align-items:center;gap:9px}
.lane-name{
  flex:0 0 44px;text-align:left;cursor:pointer;
  background:var(--slot);border:1px solid var(--groove);border-radius:3px;
  padding:6px 7px;font-family:"DM Mono";font-size:10px;letter-spacing:.06em;
  color:var(--read-dim);box-shadow:0 1px 2px rgba(0,0,0,.5) inset;
}
.lane-name:hover{color:var(--silk)}
.lane-name.sel{color:var(--dr-accent-hi);border-color:var(--dr-accent-lo);
  box-shadow:0 0 0 1px var(--dr-accent-lo) inset}
.lane-name.hit{background:var(--dr-accent);color:var(--dr-accent-ink)}

/* Sixteen across, one row per lane. MS·1 wraps its 16 steps into two rows of eight
   because it has ONE lane and the extra height costs nothing; eight lanes wrapped would
   be sixteen rows, and a drum grid that does not read left-to-right as a bar is not a
   drum grid. Gap tightens rather than wrapping when the panel narrows. */
.pads{display:grid;grid-template-columns:repeat(var(--steps,16),1fr);gap:3px;
  flex:1 1 auto;min-width:0}
.pad{
  height:22px;border-radius:3px;padding:0;cursor:pointer;position:relative;
  background:var(--slot);border:1px solid var(--groove);
  box-shadow:0 1px 2px rgba(0,0,0,.55) inset;
  transition:background .09s ease;
}
@media (prefers-reduced-motion:reduce){ .pad{transition:none} }
.pad.on{background:linear-gradient(180deg,var(--dr-accent-hi),var(--dr-accent));
  border-color:var(--dr-accent-lo);box-shadow:0 1px 0 rgba(255,255,255,.16) inset}
.pad.acc{box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 0 0 1px var(--cap-yellow) inset}
/* downbeat of each quarter, so sixteenths stay countable */
.pad.beat::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.45)}
.pad.now{outline:2px solid var(--mint);outline-offset:1px;z-index:2}
.pad.past{opacity:.35}

/* Horizontal faders. CS·1's and MS·1's versions had drifted apart by Phase 2, so these
   were not among the 38 rules the shell could share — this is DR·1's own take, sized to
   sit four across rather than one at a time. */
.hfader{display:flex;align-items:center;gap:9px;cursor:ew-resize;touch-action:none;
  padding:5px 9px;border-radius:6px;background:rgba(0,0,0,.13)}
.hslot{position:relative;flex:1 1 auto;min-width:60px;height:20px;border-radius:4px;
  background:linear-gradient(180deg,#20262a,#12161a 45%,#20262a);
  box-shadow:0 2px 4px rgba(0,0,0,.6) inset,0 1px 0 rgba(255,255,255,.06)}
.hslot::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;
  transform:translateY(-50%);background:#0b0e10;border-radius:2px}
.hcap{position:absolute;top:-3px;height:26px;width:20px;border-radius:3px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,#5b656b,#394247);border:1px solid #14181b;
  box-shadow:0 2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.18) inset}
.hcap::after{content:"";position:absolute;top:3px;bottom:3px;left:50%;width:3px;
  margin-left:-1.5px;border-radius:2px;background:var(--dr-accent)}
.hfader.dragging .hcap{border-color:var(--mint)}
.hfader .hval{font-family:"DM Mono";font-size:10px;color:#aeb8be;min-width:44px;text-align:right}
.hfader .hlab{white-space:nowrap}

.seqlegend{display:flex;gap:14px;flex-wrap:wrap;font-family:"DM Mono";font-size:9px;
  letter-spacing:.04em;color:var(--read-dim);margin-top:10px}
.seqlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;
  vertical-align:-1px;margin-right:5px}

@media (max-width:560px){
  :scope{padding:16px 14px 20px}
  .pads{grid-template-columns:repeat(8,1fr)}
  .lane-name{flex:0 0 38px}
}
}
</style>
</head>
<body>

<div class="unit dr1" data-instrument="dr1">

  <div data-face class="plate">
    <div class="model">DR·1 — drum machine</div>
    <div class="screws"><i class="screw"></i><i class="screw"></i></div>
  </div>
  <div data-face class="rule"></div>

  <div data-face class="transport">
    <button class="btn primary" id="play">▶ Play</button>
    <button class="btn ghost" id="clearPat">Clear</button>
    <button class="btn ghost" id="defaultPat">Reset pattern</button>
    <div class="tempo" data-hosted>
      <button id="bpmDown" aria-label="Slower">−</button>
      <span id="tempoOut">120</span>
      <button id="bpmUp" aria-label="Faster">+</button>
    </div>
    <button class="btn panic" id="panic">Panic</button>
  </div>

  <div data-face class="sect">
    <div class="sect-head">
      <span class="silk">Pattern</span>
      <div class="patrow">
        <div class="field" style="flex:0 0 92px">
          <label for="rate">Rate</label>
          <select id="rate">
            <option value="1/8">1/8</option>
            <option value="1/8t">1/8 trip</option>
            <option value="1/16" selected>1/16</option>
            <option value="1/16t">1/16 trip</option>
            <option value="1/32">1/32</option>
          </select>
        </div>
        <div class="field" style="flex:0 0 86px">
          <label for="len">Steps</label>
          <select id="len">
            <option value="8">8</option>
            <option value="12">12</option>
            <option value="16" selected>16</option>
            <option value="24">24</option>
            <option value="32">32</option>
            <option value="48">48</option>
            <option value="64">64</option>
          </select>
        </div>
        <div class="hfader" id="swingF">
          <span class="hlab">Swing</span>
          <span class="hslot"><i class="hcap"></i></span>
          <span class="hval">50%</span>
        </div>
        <div class="hfader" id="accentF">
          <span class="hlab">Accent</span>
          <span class="hslot"><i class="hcap"></i></span>
          <span class="hval">35%</span>
        </div>
      </div>
    </div>

    <!-- One row per voice. The grid is the instrument; the knobs are for shaping what it
         plays, which is why the grid comes first and is the widest thing on the panel. -->
    <div class="lanes" id="lanes"></div>

    <div class="seqlegend">
      <span><i style="background:var(--dr-accent)"></i>step</span>
      <span><i style="background:var(--cap-yellow)"></i>accent — click a lit step again</span>
      <span><i style="background:var(--mint)"></i>playing now</span>
    </div>
  </div>

  <div data-face class="sect">
    <div class="sect-head">
      <span class="silk">Voice <em id="voiceTag">BD</em></span>
      <span class="card-meta" id="voiceMeta">Kick</span>
    </div>
    <div class="knobrow" id="voiceKnobs">
      <div class="hfader" id="tuneF">
        <span class="hlab">Tune</span><span class="hslot"><i class="hcap"></i></span><span class="hval">—</span>
      </div>
      <div class="hfader" id="toneF">
        <span class="hlab">Tone</span><span class="hslot"><i class="hcap"></i></span><span class="hval">—</span>
      </div>
      <div class="hfader" id="decayF">
        <span class="hlab">Decay</span><span class="hslot"><i class="hcap"></i></span><span class="hval">—</span>
      </div>
      <div class="hfader" id="levelF">
        <span class="hlab">Level</span><span class="hslot"><i class="hcap"></i></span><span class="hval">—</span>
      </div>
    </div>
    <p class="note">Click a lane's name to hear that voice and edit it here. Shift-click plays it without selecting — and records the hit when DR·1 is armed.</p>
  </div>

  <div class="sect">
    <div class="sect-head">
      <span class="silk"><i class="led" id="midiLed"></i>MIDI</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="silk">Note out</span>
        <div class="seg sm" id="noteOut" role="group" aria-label="Mirror hits to MIDI out">
          <button data-o="off" class="on">Off</button>
          <button data-o="on">On</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="midiIn">Input</label>
        <select id="midiIn"><option value="">— none —</option></select>
      </div>
      <div class="field">
        <label for="midiOut">Output</label>
        <select id="midiOut"><option value="">— none —</option></select>
      </div>
      <div class="field" style="flex:0 0 74px">
        <label for="midiInCh">In ch</label>
        <select id="midiInCh"></select>
      </div>
      <div class="field" style="flex:0 0 74px">
        <label for="midiCh">Out ch</label>
        <select id="midiCh"></select>
      </div>
    </div>
    <p class="note" id="midiNote">—</p>
  </div>

</div>
<script>
/* The shell.

   Everything singular on the page lives here, so instruments can stop each assuming
   they own the document. Phase 2 gives it the two that actually collide — the root an
   instrument queries within, and the computer keyboard. The clock, the audio bus and
   the MIDI router follow in Phase 3.

   It is deliberately the same code standalone and hosted. A page with one instrument
   takes the identical path a page with three does, so the standalone builds are not a
   second configuration that can rot untested. */
window.Patchwork = (() => {
"use strict";

const roots = [];          // every instrument panel on this page, in document order
let focused = null;        // the one the computer keyboard is talking to
const handlers = [];       // {root, type, fn}

/* Which root a keydown went to, keyed by e.code. A keyup MUST reach the instrument that
   received its keydown even if focus moved in between — route it by focus instead and
   the first instrument holds that note forever. Held notes are exactly the thing a
   focus change is likely to interrupt, so this is the common case, not the corner. */
const pressed = new Map();

function instrument(id, build){
  const root = document.querySelector(`[data-instrument="${id}"]`);
  if (!root) return null;                   // this build does not include that panel
  roots.push(root);
  if (!focused) focused = root;
  build(root);
  return root;
}

/* With one instrument there is nothing to arbitrate and it is always focused, so a
   standalone build behaves exactly as it did before the shell existed. */
const contested = () => roots.length > 1;

/* Idempotent on purpose. The first instrument to register is focused before there is
   anything to contest, so an early return when the root is already focused left the
   panel that owns the keyboard with no ring on it — the one case that matters most,
   since it is the state the page opens in. */
function focus(root){
  if (!root || roots.indexOf(root) < 0) return;
  focused = root;
  if (!contested()) return;              // nothing to show with a single panel
  roots.forEach(r => r.classList.toggle("focused", r === focused));
}

document.addEventListener("pointerdown", e => {
  const el = e.target instanceof Element ? e.target.closest("[data-instrument]") : null;
  if (el) focus(el);
}, true);

function onKey(root, type, fn){
  handlers.push({root, type, fn});
}

/* One listener per event type for the whole page, dispatching to the instrument that
   owns the keyboard. Registering each instrument's handler on document directly is what
   made this a collision in the first place: every instrument saw every key. */
["keydown", "keyup"].forEach(type => {
  document.addEventListener(type, e => {
    let target = focused;
    if (type === "keydown") {
      if (e.code) pressed.set(e.code, focused);
    } else if (e.code && pressed.has(e.code)) {
      target = pressed.get(e.code);
      pressed.delete(e.code);
    }
    handlers.forEach(h => { if (h.type === type && h.root === target) h.fn(e); });
  });
});

/* A key held while the window loses focus never sends its keyup, so the note that was
   sounding has nothing to release it. Instruments already handle blur themselves; this
   just stops the routing table growing without bound. */
window.addEventListener("blur", () => pressed.clear());

return {instrument, onKey, focus,
        get roots(){ return roots.slice(); },
        get focused(){ return focused; }};
})();

/* One AudioContext for the page.

   Two instruments each opening their own context worked — the OS mixer summed them —
   but it makes everything after this impossible: two contexts have two `currentTime`
   origins and two independent clocks, so nothing scheduled against one can line up
   with the other. A shared time base is the thing the clock in Phase 3 needs, and it
   is the reason to do this first.

   Levels are unchanged. Each instrument already ends in its own compressor and master
   gain; the strip below is unity, and summing here is what the OS mixer was doing
   anyway. A master section that actually processes is a later decision, not a side
   effect of merging. */
Patchwork.audio = (() => {
"use strict";

let ctx = null, master = null;
const strips = new Map();

function context(){
  if (!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 1;
    master.connect(ctx.destination);
  }
  return ctx;
}

/* Where an instrument sends its output instead of ctx.destination. One per instrument,
   so a mixer — or a solo button — has something to hold on to later. */
function strip(id){
  context();
  if (!strips.has(id)){
    const g = ctx.createGain();
    g.gain.value = 1;
    g.connect(master);
    strips.set(id, g);
    taps.forEach(wireTap);          // an instrument built after a tap still reaches it
  }
  return strips.get(id);
}

/* A sum of every instrument's strip EXCEPT one — what the looper records when you point
   it at the studio rather than a microphone.

   Excluding the caller is the whole point: the looper's own output goes to its strip and
   on to master, so recording master would record the looper recording itself and build
   until it clips. Taps are kept and re-wired when a new strip appears, because an
   instrument can be built after the tap was made. */
const taps = [];
/* `exclude` is one id or several. The looper needs two — its own strip and the metronome's
   — because a click on the bus would be printed into every take. */
function tap(exclude){
  context();
  const g = ctx.createGain();
  g.gain.value = 1;
  const t = {node: g, exclude: [].concat(exclude || []), wired: new Set()};
  taps.push(t);
  wireTap(t);
  return g;
}
function wireTap(t){
  strips.forEach((strip, id) => {
    if (t.exclude.indexOf(id) >= 0 || t.wired.has(id)) return;
    strip.connect(t.node);
    t.wired.add(id);
  });
}

/* iOS parks the context in "suspended" until a gesture and in "interrupted" after a
   call or an app switch, so anything other than "running" needs a resume — not just
   "suspended". Both instruments carried this comment; now one place does. */
function resume(){
  context();
  if (ctx.state !== "running"){
    const p = ctx.resume();
    if (p && p.catch) p.catch(() => {});
  }
  return ctx.state;
}

return {context, strip, resume, tap,
        get ctx(){ return ctx; },
        get master(){ return master; },
        get strips(){ return new Map(strips); }};
})();

/* One clock for the page.

   Both instruments already ran the same transport — a 25 ms interval scheduling against
   ctx.currentTime with a 200 ms lookahead, and bpmExact driving the grid while the
   rounded value is display only. MS·1's copy says outright that it came from CS·1. What
   they did not share was a grid ORIGIN, and that is what stopped them locking: each set
   nextTime to ctx.currentTime + .03 at the moment its own Play was pressed, so two
   instruments started a second apart ran a second apart forever, at identical tempo.

   The shell owns the origin, the tempo and the single timer. It does NOT own musical
   position — CS·1 counts bars of varying length and MS·1 counts swung sixteenths, and
   those belong to the instruments. */
Patchwork.clock = (() => {
"use strict";

let bpm = null;                 // the exact value; rounding is for display only
let origin = null;              // ctx time of beat 0 of the running grid
let timer = null;
const running = new Set();      // tick functions currently scheduled
const tempoSubs = [];

const beatSeconds = () => 60 / (bpm || 120);

/* The audio-clock time an instrument should place its first event at.

   Nothing else running: start now, and this instrument's downbeat DEFINES the grid —
   which is exactly what a standalone build does, so its timing is unchanged. Something
   already running: land on the next boundary of the existing grid instead, so the two
   are in phase rather than merely at the same tempo.

   quantumBeats is how coarse that seam is — 4 for a bar. */
function claim(quantumBeats){
  const ctx = Patchwork.audio.context();
  const soon = ctx.currentTime + .03;
  if (origin === null || running.size === 0){
    /* ⚠️ A session IMPOSES the grid: whoever opened the jam defined beat 0, and a client
       that starts playing an hour later has to land on that grid rather than starting a
       fresh one under everyone. Asked for here rather than pushed in from outside because
       this is the one moment a fresh origin would be invented — and because the mapping
       needs an AudioContext, which does not exist when the session is joined. */
    const shared = originSource && originSource();
    if (shared == null){ origin = soon; return soon; }
    origin = shared;
  }
  const q = Math.max(1e-6, quantumBeats * beatSeconds());
  return origin + Math.ceil((soon - origin) / q) * q;
}

/* Where a shared grid comes from — see shell/session.js. Returns null when playing alone,
   which is every standalone build and the studio until someone starts a jam. */
let originSource = null;
function setOriginSource(fn){ originSource = fn; }

let ticks = 0;
function pump(){
  ticks++;
  /* A tick that throws must not take the other instruments' transports down with it. */
  running.forEach(fn => { try{ fn(); }catch(e){ console.error("clock tick failed", e); } });
}

/* ---- what drives the tick ----
   ⚠️ setInterval STOPS IN A TAB YOU CANNOT SEE. Measured: a plain setInterval(fn, 25) in a
   non-visible tab produced 4 ticks in 3 seconds where 120 were asked for — about 1.3 Hz,
   against a scheduler that looks 200 ms ahead. That is not a degraded tick, it is a stopped
   one, and every instrument on the page goes silent behind it.

   Chrome exempts pages that are PLAYING AUDIO, which is why this was invisible for so long:
   a jam in progress was never the case that broke. The case that breaks is a client sitting
   in a session with nothing sounding, waiting to fire a row — its clock has stalled by the
   time it does, and in a shared session that is everybody's problem rather than its own.

   So the tick comes off the AUDIO THREAD instead. It is real-time, it is never throttled
   while the context runs, and this clock was always about audio time — the interval was
   only ever a way of asking "has 25 ms passed".

   Three things this needs and would otherwise be an afternoon:

   - THE NODE MUST BE CONNECTED. A worklet nobody pulls is a worklet whose process() is never
     called, so it goes through a zero gain to the destination: audible to nothing, pulled by
     the graph all the same.
   - THE MODULE LOADS ASYNCHRONOUSLY. The interval keeps running until the worklet is live.
     Double-ticking across the handover is harmless — every instrument's tick() only schedules
     while nextTime is inside the lookahead, so a second call finds nothing to do.
   - A SLOW INTERVAL STAYS as a backstop, because a suspended context stops the audio thread
     too. It is far too slow to be the mechanism and is not meant to be; it is there so a
     failure sounds like gaps rather than silence, and it heals as soon as the worklet
     returns. */
const TICK_SRC = "\n" + [
  "class TickProcessor extends AudioWorkletProcessor {",
  "  constructor(){ super(); this.n = 0; }",
  "  process(){",
  "    /* 128 frames a quantum, so eight of them is about 21 ms at 48 kHz - near enough the",
  "       25 ms the interval asked for, and indifferent to whether the tab is visible. */",
  "    if (++this.n >= 8){ this.n = 0; this.port.postMessage(0); }",
  "    return true;",
  "  }",
  "}",
  "registerProcessor('pw-tick', TickProcessor);"
].join("\n");

let tickNode = null, tickLoading = false;
const FAST = 25, BACKSTOP = 500;
let interval = FAST;

function setInterval_(ms){
  if (timer != null) clearInterval(timer);
  interval = ms;
  timer = setInterval(pump, ms);
}

function ensureTicker(){
  if (tickNode || tickLoading) return;
  const ctx = Patchwork.audio && Patchwork.audio.ctx;
  if (!ctx || !ctx.audioWorklet) return;          // the interval is covering us
  tickLoading = true;
  /* a Blob URL, the same trick LP·1's worklet uses to keep the one-file rule */
  const url = URL.createObjectURL(new Blob([TICK_SRC], {type: "text/javascript"}));
  ctx.audioWorklet.addModule(url).then(() => {
    URL.revokeObjectURL(url);
    const n = new AudioWorkletNode(ctx, "pw-tick",
      {numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1]});
    const mute = ctx.createGain();
    mute.gain.value = 0;
    n.connect(mute); mute.connect(ctx.destination);
    n.port.onmessage = () => { if (running.size) pump(); };
    tickNode = n;
    if (timer != null) setInterval_(BACKSTOP);
  }).catch(() => { tickLoading = false; });      // stay on the interval
}

function run(fn){
  running.add(fn);
  ensureTicker();
  if (timer == null) setInterval_(tickNode ? BACKSTOP : FAST);
}

function stop(fn){
  running.delete(fn);
  if (running.size === 0){
    clearInterval(timer); timer = null;
    origin = null;              // the next instrument to start defines a fresh grid
  }
}

/* Tempo is shared, so a change on either panel moves both. `from` names the instrument
   that made the change, so its own handler can skip the round trip and avoid fighting
   the control the user is currently dragging. */
function setBpm(v, from){
  const next = Math.min(240, Math.max(20, +v || 0));
  if (bpm === null){ bpm = next; return bpm; }
  if (next === bpm) return bpm;
  bpm = next;
  tempoSubs.forEach(s => { if (s.id !== from) s.fn(bpm); });
  return bpm;
}

/* The first instrument to register decides the page's tempo; every one after it adopts
   that value on the spot. Without this the two ran at their own defaults — CS·1 at 88 and
   MS·1 at 120 — until someone happened to touch a tempo control, so "shared tempo" would
   have been true only after the fact. */
/* The rate trim from whichever instrument owns the phase lock.

   CS·1's phaseAdjust() has two terms and only one of them generalises. The NUDGE is a
   phase pull sized against one chord and capped per chord; applying it to a sixteenth
   as well would correct sixteen times too hard. The TRIM is a rate correction — the
   term that exists because tempo is measured off performance.now() but spent against
   ctx.currentTime, two different crystals, so the error integrates forever. That one is
   just "run this fraction faster", which is true of any interval, and it is the term
   behind the measured 54 ms/min.

   So the trim is shared and the nudge is not. The residual: while the loop is pulling in
   a phase error, CS·1 moves against MS·1 by up to maxAdj (10 ms) per chord until it
   settles. Sharing the nudge too means the shell owning musical position for both
   instruments, which is the scene launcher's job, not this one's. */
let rate = 1;
function setRate(r){ rate = (isFinite(r) && r > 0.5 && r < 1.5) ? r : 1; }

function onTempo(id, fn, initial){
  tempoSubs.push({id, fn});
  if (bpm === null) bpm = Math.min(240, Math.max(20, +initial || 120));
  else if (initial != null && initial !== bpm) fn(bpm);
  return bpm;
}

return {claim, run, stop, setBpm, onTempo, beatSeconds, setRate, setOriginSource,
        get rate(){ return rate; },
        get bpm(){ return bpm; },
        get origin(){ return origin; },
        get running(){ return running.size; },
        /* what is actually driving the tick, and how many it has done — diagnostics, but
           the kind you want when a session sounds like it has stalled */
        get driver(){ return tickNode ? "worklet" : (timer != null ? "interval" : "none"); },
        get ticks(){ return ticks; }};
})();

/* The metronome.

   It belongs to the page, not to an instrument. It started inside LP·1 because that is
   where you need it — you play a take to a click — but a click is the same thing the whole
   rack is counting against, so it sits beside the tempo in the Scenes head and lives here.

   ⚠️ It has its OWN strip, and the looper's tap excludes it. LP·1 records a sum of every
   strip except the ones it names; a click anywhere else on the bus would be printed into
   every take, audible in the loop for the rest of the session and doubled by the first
   overdub. Measured before the move and again after: a take cut with only the click
   running has an input peak of 0.

   It runs on the shared clock like any other voice, so it IS the tempo rather than a second
   opinion about it. Started alone it claims the grid, and whatever starts next lands in
   phase with the click — which is what a metronome is for. */
Patchwork.click = (() => {
"use strict";

let ctx = null, gain = null, on = false, level = .7, nextAt = 0;
const subs = [];
function notify(){ subs.forEach(fn => { try{ fn(); }catch(e){} }); }

/* The strip id, so LP·1 can name it in its exclusion list. */
const STRIP = "click";

function blip(t, accent){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(accent ? 1560 : 1040, t);
  /* a 2 ms rise, because a square starting at full level clicks in a way that reads as a
     fault rather than as a click track */
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(accent ? .5 : .28, t + .002);
  g.gain.exponentialRampToValueAtTime(.0004, t + .042);
  o.connect(g); g.connect(gain);
  o.start(t); o.stop(t + .06);
}

function tick(){
  if (!on || !ctx) return;
  const beat = 60 / (Patchwork.clock.bpm || 120);
  const origin = Patchwork.clock.origin;
  while (nextAt < ctx.currentTime + .2){
    const at = Math.max(ctx.currentTime + .005, nextAt);
    /* The accent comes from the grid ORIGIN, not from counting blips: claim(1) lands on the
       next beat, not the next bar, so counting would put the downbeat wherever you happened
       to press the button. */
    const n = origin == null ? 0 : Math.round((at - origin) / beat);
    blip(at, (((n % 4) + 4) % 4) === 0);
    nextAt += beat * Patchwork.clock.rate;
  }
}

function set(want){
  on = !!want;
  if (on){
    ctx = Patchwork.audio.context();
    Patchwork.audio.resume();
    if (!gain){
      gain = ctx.createGain();
      gain.gain.value = level;
      gain.connect(Patchwork.audio.strip(STRIP));
    }
    nextAt = Patchwork.clock.claim(1);
    tick();
    Patchwork.clock.run(tick);
  } else {
    Patchwork.clock.stop(tick);
  }
  notify();
}

function setLevel(v){
  level = Math.max(0, Math.min(1, v));
  if (gain) gain.gain.setTargetAtTime(level, ctx.currentTime, .01);
  notify();
}

return {set, setLevel, toggle: () => set(!on), STRIP,
        onChange: fn => subs.push(fn),
        get on(){ return on; },
        get level(){ return level; }};
})();

/* One MIDI router for the page.

   `port.onmidimessage` is a single-handler PROPERTY, not an event target. Two
   instruments each assigning it means the second silently replaces the first, so on a
   page with both, whichever bound last received everything and the other was deaf —
   with no error and nothing in the console to suggest it.

   The router binds once and fans out. Channel routing does not move here: each
   instrument already filters by channel on the way in, and that is where it belongs —
   MS·1 splits synth, vocoder, bass and CC across four channels of its own, which is not
   something a shared router should have opinions about.

   The input port is the page's, like the tempo. Selecting one on either panel binds it
   for everything, and every panel's selector follows. */
Patchwork.midi = (() => {
"use strict";

let accessPromise = null, access = null, port = null;
const subs = [];                 // {id, onMidi, onPort}

/* One requestMIDIAccess for the page — two calls mean two permission paths and two
   onstatechange owners racing to rebuild the same port lists. */
function open(){
  if (accessPromise) return accessPromise;
  if (!navigator.requestMIDIAccess)
    return accessPromise = Promise.reject(new Error("unavailable"));
  accessPromise = navigator.requestMIDIAccess({sysex:false}).then(a => {
    access = a;
    a.onstatechange = () => {
      /* A port can vanish while bound — unplugging the interface. Drop the stale
         reference before telling anyone, or every subscriber re-reads a dead port. */
      if (port && !ports("inputs").some(p => p.id === port.id)) port = null;
      subs.forEach(s => { try{ s.onPort(port); }catch(e){} });
    };
    return a;
  });
  return accessPromise;
}

function ports(kind){ return access ? Array.from(access[kind].values()) : []; }

function fanout(e){
  /* A handler that throws must not stop the message reaching the other instruments. */
  subs.forEach(s => { try{ s.onMidi(e); }catch(err){ console.error("midi handler failed", err); } });
}

/* Register an instrument. onMidi gets every message — filter by channel yourself.
   onPort is called when the page's input changes, including when the OTHER panel
   changed it, so a selector and an LED can follow. */
function route(id, onMidi, onPort){
  subs.push({id, onMidi, onPort: onPort || function(){}});
}

function select(portId){
  if (port){ try{ port.onmidimessage = null; }catch(e){} }
  port = portId ? (ports("inputs").find(p => p.id === portId) || null) : null;
  if (port) port.onmidimessage = fanout;
  subs.forEach(s => { try{ s.onPort(port); }catch(e){} });
  return port;
}

return {open, ports, route, select,
        get access(){ return access; },
        get port(){ return port; }};
})();

/* Scenes.

   A scene is a row: one pattern per instrument, fired together. Firing does not take
   effect where you clicked — it takes effect at the next musical seam, which is what
   makes this playable rather than a series of small mistakes.

   A scene captures the PATTERN, not the sound. Firing one changes what an instrument
   plays and leaves the filter you just dialled alone. That is the least surprising rule,
   and it keeps the deep panels for setting up and the scene row for performing.

   ---

   The seam has to be a SCHEDULING boundary, not a wall-clock one. Every instrument
   schedules ~200 ms ahead, so swapping a pattern when ctx.currentTime crosses the bar
   line lands the change a fifth of a second late — the old pattern has already been
   scheduled past the seam. CS·1 solved this before the shell existed, with takePending()
   called inside its tick right before the next chord is scheduled. This generalises that:
   an instrument calls take() at its own loop point, so the swap happens on the seam in
   the same time domain the notes are placed in. */
Patchwork.scenes = (() => {
"use strict";

const insts = [];                 // {id, name, capture, apply, isPlaying}
const rows = [];                  // rows[i] = {name, cells:{id: pattern}}
const pending = new Map();        // id -> pattern, waiting for that instrument's seam
const queued = new Map();         // id -> row index, for the UI to show what is armed
/* Which row each instrument is playing FROM — `queued` is what is waiting for a seam,
   this is what landed. Recorded rather than derived: two rows holding the same pattern
   are equal by value, so comparing the cell against what an instrument is playing would
   call them the same row. */
const onRow = new Map();          // id -> row index it is playing
const subs = [];

/* ---- when a fired row actually lands ----
     instant   on the click
     bar       the next bar line
     pattern   when CS·1's progression starts over

   All three are computed from the shared clock rather than signalled between instruments:
   the boundary is every N bars from the grid origin, and CS·1 reports how many bars its
   progression is. Every instrument arrives at the same answer on its own, and checks it
   INSIDE its scheduling loop, so the change is accurate to the grid rather than 200 ms
   late behind the lookahead. */
let quantum = "pattern";
/* ⚠️ The pattern length is the PAGE's, set in the Scenes head and drawn by the bar counter
   there. It used to be whatever CS·1's progression happened to be, which made the boundary
   circular for CS·1 itself: bringing it in meant waiting for a seam defined by the thing
   that was not playing yet. A number you set is one every instrument, CS·1 included, can
   arrive at the same way. */
let patternBars = 4;
const lastSeen = new Map();           // id -> the time of the last step it scheduled

function setQuantum(q){
  if (["instant", "bar", "pattern"].indexOf(q) < 0) return;
  quantum = q;
  notify();
}
function setPatternBars(n){
  patternBars = Math.max(1, n | 0);
  notify();
}
function quantumSeconds(){
  const bar = 4 * Patchwork.clock.beatSeconds();
  return quantum === "bar" ? bar : patternBars * bar;
}

/* Sixteen rows. The launcher, the live grid and LP·1's take strip all draw from this, so
   this is the one place the number lives — except the worklet's filled(), which cannot
   see it across the AudioWorklet boundary and says so. */
const COUNT = 16;
for (let i = 0; i < COUNT; i++) rows.push({name: String(i + 1), cells: {}});

function notify(){ subs.forEach(fn => { try{ fn(); }catch(e){} }); }
function onChange(fn){ subs.push(fn); }

function register(id, spec){
  insts.push({id, name: spec.name || id, capture: spec.capture, apply: spec.apply,
              isPlaying: spec.isPlaying || (() => false),
              start: spec.start || function(){},
              stop: spec.stop || function(){}});
  notify();
}

/* Capture is a deep copy at the moment you press it. Storing a live reference would make
   every scene in the bank point at the same object, so editing the grid would silently
   rewrite every scene that had ever been captured from it. */
function put(row, id){
  const it = insts.find(x => x.id === id);
  if (!it || !rows[row]) return null;
  rows[row].cells[id] = JSON.parse(JSON.stringify(it.capture()));
  return it;
}

/* Putting a clip into a row that is ALREADY PLAYING brings that instrument in, exactly as
   if the row had been fired again — which is what you had to do, and the reason a gesture
   that should read as "add this to what I am hearing" read as nothing happening.

   Only when the instrument is stopped. One playing row 2 and a clip stored into row 1 is
   you filling the launcher while you play, not asking to be moved; a store is not a fire,
   and silently yanking a running instrument onto another row is a mistake you cannot see
   coming. Everything else about the join is fire()'s: the pattern, the start, and the bar
   line it lands on. */
function store(row, id){
  const it = put(row, id);
  if (!it) return;
  if (!it.isPlaying() && live(row)) fire(row, id);
  else notify();
}

/* Keep the block an instrument is playing OUT OF in step with what it is playing.

   Live recording writes onto the running grid, and the cell still held the copy taken when
   the row was pressed — so everything you played was one row-fire away from being thrown
   out, and the gesture only looked like it had worked until you used it. Arming a track and
   playing into a scene now updates that scene as you play.

   Only a cell that already exists. If the row has nothing for this instrument then the row
   is not what it is playing, and creating a block is a deliberate gesture — shift-click, or
   the row's ● — not something a stray note should do. */
function restore(id){
  const row = onRow.get(id);
  if (row == null || !rows[row] || !playing(id)) return;
  if (!rows[row].cells[id]) return;
  put(row, id);
  notify();
}

/* Replace the whole bank. A session sends the rows entire rather than diffing them —
   at this size the diff costs more than the copy, and a full snapshot cannot drift.
   Deep-copied on the way in for the same reason capture() is: a shared reference would
   make every client's grid the same object as the message it arrived in. */
function loadRows(next){
  if (!Array.isArray(next)) return;
  rows.forEach((r, i) => {
    const src = next[i];
    r.cells = src && src.cells ? JSON.parse(JSON.stringify(src.cells)) : {};
  });
  notify();
}

/* Capturing the whole rack into a row does NOT join. It takes what every instrument
   happens to be holding, stopped ones included, and starting those is nobody's ask. */
function storeAll(row){ insts.forEach(it => put(row, it.id)); notify(); }

/* Is this instrument sounding out of THIS row? onRow can hold a stale entry for one
   stopped from its own panel, so the transport is asked as well. */
function playingFrom(row, id){ return onRow.get(id) === row && playing(id); }

/* ...or queued to it. A cell deleted while its row is still waiting for the seam has to
   turn that pending pattern into a pending stop: `pending` holds a REFERENCE to the cell
   object, and deleting the cell out of `rows` does not reach into it, so the block you
   just removed would otherwise land anyway a bar later. */
function boundTo(row, id){ return playingFrom(row, id) || queued.get(id) === row; }

/* Is anything actually sounding from this row? */
function live(row){
  for (const id of onRow.keys()) if (playingFrom(row, id)) return true;
  return false;
}

/* Emptying the cell an instrument is playing out of STOPS it — the mirror of the join,
   and the rule firing a row already follows: a row with nothing for an instrument is a
   row that instrument is silent in. Deleting the block you can hear and hearing it carry
   on is the launcher disagreeing with itself.

   ONLY the cell being played out of. Clearing row 3 while row 1 is what you are hearing
   is housekeeping, not a transport gesture, and must not touch what is sounding. */
function clear(row, id){
  if (!rows[row]) return;
  const stopping = [];
  if (id){
    if (boundTo(row, id)) stopping.push(id);
    delete rows[row].cells[id];
  } else {
    insts.forEach(it => { if (boundTo(row, it.id)) stopping.push(it.id); });
    rows[row].cells = {};
  }
  /* fire() on the now-empty cell IS the stop, and it is the same stop a fired row gives:
     queued to that instrument's loop point at every quantum but `instant`, so nothing is
     cut mid-bar. It notifies, which is why this does not. */
  if (!stopping.length){ notify(); return; }
  stopping.forEach(x => fire(row, x));
}

/* Arm a pattern. An instrument that is not running has no seam coming, so it takes the
   change immediately — otherwise firing a scene with the transport stopped does nothing
   visible and looks broken. */
/* Firing a row STARTS anything it lands on that was stopped, and STOPS anything the row
   has nothing for.

   The empty cell is the part that matters. A row is a complete picture of what should be
   playing, so an instrument with no clip in it falls silent — otherwise firing row 2
   leaves row 1's bass running underneath, and what you hear is neither row. Ableton does
   the same, and for the same reason.

   Both the start and the stop land on the instrument's loop point, not on the click, so a
   row change never cuts a bar in half. */
function fire(row, id){
  if (!rows[row]) return;
  const targets = id ? insts.filter(x => x.id === id) : insts;
  targets.forEach(it => {
    const pat = rows[row].cells[it.id];
    if (!pat){
      if (it.isPlaying() && quantum !== "instant"){
        /* null is the pending STOP — take() reads it at the seam */
        pending.set(it.id, null);
        queued.set(it.id, row);
      } else if (it.isPlaying()){
        it.stop();
        pending.delete(it.id);
        queued.delete(it.id);
        onRow.delete(it.id);
      } else {
        pending.delete(it.id);
        queued.delete(it.id);
        onRow.delete(it.id);
      }
      return;
    }
    if (it.isPlaying() && quantum !== "instant"){
      pending.set(it.id, pat);
      queued.set(it.id, row);
    } else {
      /* stopped: take it now and start, so the row is audible from the press */
      it.apply(JSON.parse(JSON.stringify(pat)));
      queued.delete(it.id);
      onRow.set(it.id, row);
      it.start();
    }
  });
  notify();
}

/* Start an instrument's transport without touching its pattern — what a just-recorded
   track needs, since the pattern it should play is already the one it has. */
/* `row` is which row it is starting FROM, when the caller knows — recording into a row
   is what a track being started is usually for, and without it the row it is now playing
   would not count as live and the next track added to it would not join. */
function start(id, row){
  const it = insts.find(x => x.id === id);
  if (!it) return;
  if (!it.isPlaying()) it.start();
  /* after the attempt, not before: start() can decline — PM·1 says so out loud when its
     Motion is Off — and a row nothing is sounding from is not a row to join */
  if (row != null && it.isPlaying()) onRow.set(id, row);
  notify();
}

/* Called by an instrument from inside its tick for EVERY step it schedules, with the
   audio time of that step. It used to be called only at a loop point, which hard-coded
   pattern-length quantisation; the boundary is a setting now, so the shell has to see
   every step to know when one is crossed.

   `lastSeen` is updated even with nothing pending, or the first crossing after a fire has
   no previous step to compare against and would be missed. */
function take(id, when){
  const prev = lastSeen.get(id);
  if (when != null) lastSeen.set(id, when);
  if (!pending.has(id)) return false;
  if (quantum !== "instant"){
    const origin = Patchwork.clock.origin;
    const q = quantumSeconds();
    if (origin == null || prev == null || !(q > 0)) return false;
    /* did this step cross a boundary the previous one had not? */
    if (Math.floor((when - origin) / q) <= Math.floor((prev - origin) / q)) return false;
  }
  const it = insts.find(x => x.id === id);
  const pat = pending.get(id);
  const row = queued.get(id);
  pending.delete(id);
  queued.delete(id);
  if (!it){ notify(); return true; }
  /* a queued null means the row had nothing for this instrument: stop, at the seam */
  if (pat === null){ it.stop(); onRow.delete(id); }
  else { it.apply(JSON.parse(JSON.stringify(pat))); if (row != null) onRow.set(id, row); }
  notify();
  return true;
}

/* ---- the live pattern ----
   What an instrument is playing RIGHT NOW, as opposed to the copy sitting in a cell. A cell
   only changes when someone stores into it, so a session that shared cells alone showed an
   edit to the other machines when a row was fired and not before — you would change a step
   and watch nothing happen anywhere else.

   Same capture()/apply() a scene uses. They have always been the instrument's whole pattern;
   nothing needed adding to them. */
function livePattern(id){
  const it = insts.find(x => x.id === id);
  if (!it) return null;
  try{ return it.capture(); }catch(e){ return null; }
}
function setLivePattern(id, pat){
  const it = insts.find(x => x.id === id);
  if (!it || !pat) return;
  try{ it.apply(JSON.parse(JSON.stringify(pat))); }catch(e){}
}

/* Whether an instrument's own transport is running. The live page needs it to draw a
   master Play that reflects what is actually going, rather than a button with an opinion. */
function playing(id){
  const it = insts.find(x => x.id === id);
  return !!(it && it.isPlaying());
}

return {register, store, storeAll, clear, fire, take, onChange, playing, start,
        setQuantum, setPatternBars,
        get quantum(){ return quantum; },
        get patternBars(){ return patternBars; },
        get rows(){ return rows; },
        get instruments(){ return insts.map(i => ({id: i.id, name: i.name})); },
        get queued(){ return new Map(queued); },
        get onRow(){ return new Map(onRow); },
        live, restore, loadRows, livePattern, setLivePattern,
        /* Nothing here can see an instrument's own Play button. The transports are the
           instruments' and they change without telling the model, so a caller that has
           just moved one says so — the same signal record.changed() is. */
        changed: notify,
        has(row, id){ return !!(rows[row] && rows[row].cells[id]); }};
})();

/* Live faces.

   Each instrument shows a small performance face by default in the studio, with its full
   panel one click away. NOTHING IS REMOVED — MS·1 keeps all fifty knobs; the face is a
   filter over the panel that already exists, not a second UI that can drift from it.

   That choice is the whole design. A curated performance panel written separately would
   be a third copy of every control's wiring, and the first one to go stale. Instead each
   panel marks the blocks worth having while playing with `data-face`, and face mode hides
   the rest. A control that is hidden is still bound, still MIDI-learnable, and still there
   the moment you open the panel back up.

   Standalone builds default to the full panel: a single instrument on a page of its own
   should be its whole self. The studio defaults to faces, because three full panels is the
   wall this exists to avoid. */
Patchwork.faces = (() => {
"use strict";

const subs = [];
function notify(){ subs.forEach(fn => { try{ fn(); }catch(e){} }); }

function isOn(root){ return root.classList.contains("face"); }

function set(root, on){
  if (!root) return;
  root.classList.toggle("face", !!on);
  const btn = root.querySelector(".face-toggle");
  if (btn){
    const back = root === soloed;
    btn.textContent = back ? "← Back" : "Panel";
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.title = back ? "Back to all the instruments"
                     : "Open this instrument on its own, with every control";
  }
  notify();
}
function toggle(root){ set(root, !isOn(root)); }
function setAll(on){ Patchwork.roots.forEach(r => set(r, on)); }

/* ---- solo ----
   Opening an instrument's panel gives it the whole window and hides everything else,
   rather than expanding it in place and pushing five other panels off the bottom. A panel
   is 3000 px of controls; seeing it next to a scene launcher you cannot reach helps
   nobody.

   Only meaningful with more than one instrument. A standalone build has nothing to hide,
   so its button stays a plain face/panel toggle. */
let soloed = null;

/* `contested` lives in host.js and is private to it, so this asks the public roster. */
const several = () => Patchwork.roots.length > 1;

function solo(root){
  if (!several()) { set(root, false); return; }     // one instrument: just open the panel
  soloed = root;
  Patchwork.roots.forEach(r => r.classList.toggle("solo", r === root));
  document.body.classList.add("soloing");
  set(root, false);                                  // full panel while it has the window
  window.scrollTo(0, 0);
  notify();
}
function unsolo(){
  if (!soloed) return;
  const was = soloed;
  soloed = null;
  Patchwork.roots.forEach(r => r.classList.remove("solo"));
  document.body.classList.remove("soloing");
  set(was, true);                                    // back to its face
  /* the panel it came from is where the eye was, so put it back under the pointer */
  if (was.scrollIntoView) was.scrollIntoView({block: "nearest"});
  notify();
}

/* Escape backs out, because a full-window view with one way out is a view people get
   stuck in. */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && soloed) unsolo();
});

/* The button is injected rather than written into three panel.html files. One
   implementation, and an instrument added later gets it without being told to. */
function mount(){
  Patchwork.roots.forEach(root => {
    if (root.querySelector(".face-toggle")) return;
    const plate = root.querySelector(".plate");
    if (!plate) return;
    const b = document.createElement("button");
    b.className = "btn ghost sm face-toggle";
    b.type = "button";
    b.addEventListener("click", () => soloed === root ? unsolo() : solo(root));
    /* before the screws, so it reads as part of the panel rather than floating */
    const screws = plate.querySelector(".screws");
    if (screws) plate.insertBefore(b, screws); else plate.appendChild(b);
    set(root, false);
  });
}

return {mount, set, setAll, toggle, solo, unsolo, isOn,
        onChange: fn => subs.push(fn),
        get soloed(){ return soloed; },
        get count(){ return Patchwork.roots.filter(isOn).length; }};
})();

/* One computer keyboard, for every instrument that has notes.

   PM·1 grew one and the other four did not, so "playable without hardware" was true of
   exactly one panel out of six. This is the arrangement faces.js already uses for the Panel
   button: one implementation in the shell, and an instrument added later gets it by asking
   rather than by being copied into.

   host.js decides WHICH panel the keys reach — the focused one. This decides what they
   MEAN, and it is deliberately thin about it: an instrument says what a key index plays and
   how to start and stop it, so a drum machine maps the row to its eight lanes while a synth
   maps it to semitones, and neither has to know about the other. */
Patchwork.keys = (() => {
"use strict";

/* The tracker layout every soft synth uses: the home row is the white keys and the row
   above holds the black ones roughly where they physically sit. */
const MAP = {a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10,
             j:11, k:12, o:13, l:14, p:15, ";": 16};

function mount(root, spec){
  /* The RESOLVED value is held, not the key index. Shift the octave with a note down and
     map(i) answers differently, so a keyup routed through map() would release a note that
     was never started and leave the sounding one held forever. */
  const held = new Map();
  let oct = 0;                    // only used when the instrument has no octave of its own

  const editing = e => {
    const tag = (e.target.tagName || "").toLowerCase();
    return tag === "input" || tag === "select" || tag === "textarea";
  };
  const release = i => {
    const v = held.get(i);
    held.delete(i);
    if (v == null) return;
    if (spec.off) spec.off(v);
    if (Patchwork.session) Patchwork.session.played(root.dataset.instrument, v, 0, false);
  };

  Patchwork.onKey(root, "keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || editing(e)) return;
    /* An instrument that wanted this key already took it. PM·1's program mode walks its
       step grid with the arrows, and while that is on it is the better use of them. */
    if (e.defaultPrevented) return;

    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
      const d = e.key === "ArrowRight" ? 1 : -1;
      /* ⚠️ Release first. PM·1 applies its octave inside noteOff() as well as noteOn(), so
         moving it under a held key would release a note it never started and leave the
         sounding one held forever. Rare with a pair of ± buttons; the ordinary case the
         moment the arrows do it. */
      [...held.keys()].forEach(release);
      /* An instrument with its own octave control drives THAT, so its readout keeps
         telling the truth. One without keeps the offset here instead. */
      if (spec.octave) spec.octave(d);
      else oct = Math.max(-3, Math.min(3, oct + d));
      if (spec.paint) spec.paint();
      e.preventDefault();
      return;
    }

    const i = MAP[e.key.toLowerCase()];
    if (i == null || e.repeat || held.has(i)) return;
    const v = spec.map(i, oct);
    if (v == null) return;         // fewer things to play than there are keys — a drum kit
    held.set(i, v);
    spec.on(v, 100);
    /* Everyone else hears it too. Here rather than in each instrument because this IS the
       one place every instrument's typed notes pass through — and because a note played by
       a PERSON is what travels; a sequencer's notes are already implied by the shared
       pattern and would arrive twice. */
    if (Patchwork.session) Patchwork.session.played(root.dataset.instrument, v, 100, true);
    if (spec.paint) spec.paint();
    e.preventDefault();
  });

  Patchwork.onKey(root, "keyup", e => {
    const i = MAP[e.key.toLowerCase()];
    if (i == null || !held.has(i)) return;
    release(i);
    if (spec.paint) spec.paint();
  });

  /* A key held while the window loses focus never sends its keyup, so nothing would
     release the note. host.js clears its own routing table for the same reason. */
  window.addEventListener("blur", () => {
    if (!held.size) return;
    [...held.keys()].forEach(release);
    if (spec.paint) spec.paint();
  });
}

return {mount, get layout(){ return Object.assign({}, MAP); }};
})();

/* Live recording.

   Ableton's gesture: the transport is already running, you arm a track, you play, and
   what you play lands in the clip on the grid. Nothing stops, nothing is a take.

   The shell owns arming and the global record state; each instrument owns what "write a
   note" means, because a drum lane, a bass line and a chord progression are not the same
   thing and a shared writer would have to pretend they were. */
Patchwork.record = (() => {
"use strict";

const kit = [];              // {id, name, write, arm, disarm, canRecord}
const armed = new Set();
const subs = [];

function notify(){ subs.forEach(fn => { try{ fn(); }catch(e){} }); }
function onChange(fn){ subs.push(fn); }

function register(id, spec){
  kit.push({id, name: spec.name || id,
            write: spec.write || null,
            arm: spec.arm || function(){},
            disarm: spec.disarm || function(){},
            slots: !!spec.slots,
            /* whether played notes land on the grid as you play, as opposed to the
               pattern being copied when a row is pressed */
            live: !!spec.write,
            recordSlot: spec.recordSlot || null,
            playSlot: spec.playSlot || null,
            hasSlot: spec.hasSlot || null,
            clearSlot: spec.clearSlot || null,
            /* which slot it is working out of right now, or null. A slot track has no
               scene row, so the launcher cannot ask scenes.onRow which cell to ring. */
            liveSlot: spec.liveSlot || null,
            /* stop this track's own transport. A scene member is stopped through
               scenes.stop(); a slot track keeps its transport privately, so it has to
               offer one or a master stop would leave the looper running. */
            stop: spec.stop || null,
            /* audio in and out of a slot, for a shared jam */
            grabTake: spec.grabTake || null,
            loadTake: spec.loadTake || null,
            sampleRate: spec.sampleRate || null,
            takeMeta: spec.takeMeta || null,
            /* Armable by default. Arming means "put what you have into the row I press",
               which every registered track can do — CS·1's progression captures as readily
               as a step grid. write() is a SEPARATE, narrower capability: taking notes you
               play live onto a grid as you play them. Conflating the two is what greyed
               out CS·1's arm for no good reason. */
            canRecord: spec.canRecord == null ? true : spec.canRecord});
  notify();
}
function track(id){ return kit.find(x => x.id === id) || null; }

function setArmed(id, want){
  const it = kit.find(x => x.id === id);
  if (!it || !it.canRecord) return;
  if (want){ armed.add(id); it.arm(true); } else { armed.delete(id); it.disarm(); }
  notify();
}
function toggleArm(id){ setArmed(id, !armed.has(id)); }

/* ---- record into a scene row ----
   One gesture, and it has to be audible from the press. Hitting ● on a row:

     - every ARMED track starts if it was stopped, and has whatever is in its sequencer
       copied into that row
     - every UNARMED track fires that row and plays back what is already there, starting
       if it was stopped
     - a track with slots — the looper — takes a real audio take instead of a copy

   The starting is the part that was missing and the part that makes it feel like a
   recorder: before, the cell filled and nothing sounded, so the gesture looked like it
   had failed. An armed track also has to be RUNNING for live note capture to reach the
   grid at all, since a step index is meaningless with no transport — so starting it is
   what lets you arm a second track and play into the same row a moment later.

   Order matters: armed tracks start FIRST, so their pattern is running before the copy is
   taken and the row gets what you are actually hearing. */
function captureRow(row){
  kit.forEach(it => {
    if (!armed.has(it.id)) return;
    if (it.slots && it.recordSlot){ it.recordSlot(row); return; }
    /* the row is passed so the shell knows this track is now playing FROM it — that is
       what lets a track added to the same row a moment later join what you are hearing */
    Patchwork.scenes.start(it.id, row);
    Patchwork.scenes.store(row, it.id);
  });
  Patchwork.scenes.instruments.forEach(i => {
    if (!armed.has(i.id)) Patchwork.scenes.fire(row, i.id);
  });
  kit.forEach(it => {
    if (armed.has(it.id) || !it.slots || !it.playSlot) return;
    it.playSlot(row);
  });
  notify();
}

/* Live note capture stays gated on the track being armed. There is no global record
   switch any more, so an armed track writes what you play as you play it, and the row
   button is what commits the result to a scene.

   A track with no write() — CS·1 — simply ignores this and is captured whole when a row
   is pressed. Being armed still means something for it. */
function note(id, midi, vel, when){
  if (!armed.has(id)) return -1;
  const it = kit.find(x => x.id === id);
  if (!it || !it.write) return -1;
  let i = -1;
  try{ i = it.write(midi, vel, when); }catch(e){ return -1; }
  /* The note is on the instrument's grid; the BLOCK it is playing out of has to follow, or
     you are recording into something the next row-fire quietly discards. write() returns
     the step it landed on, or -1 when it landed nowhere — a transport that is not running
     has no step to write to — so nothing is re-stored for a note that was not taken. */
  if (i >= 0) Patchwork.scenes.restore(id);
  return i;
}

/* ---- the arm control ----
   Injected, not written into six panel.html files — the arrangement faces.js uses for the
   Panel button, and for the same reason: one implementation, and an instrument added later
   gets it without being told to.

   It used to live as a row above the live grid. That put the choice of WHAT you are
   recording six columns away from the instrument you were playing, and made the grid's
   header a control panel rather than a set of labels. On the plate it sits on whichever
   instrument you are looking at, and it is on the face as well as the panel — arming is a
   performance decision. */
function mount(){
  Patchwork.roots.forEach(root => {
    if (root.querySelector(".arm-toggle")) return;
    const id = root.dataset.instrument;
    const it = kit.find(x => x.id === id);
    if (!it || !it.canRecord) return;
    const plate = root.querySelector(".plate");
    if (!plate) return;
    const b = document.createElement("button");
    b.className = "btn ghost sm arm-toggle";
    b.type = "button";
    b.dataset.arm = id;
    b.textContent = "Arm";
    /* Every track can be armed. What differs is whether playing also writes to the grid as
       you go, which the tooltip says rather than leaving you to find out. */
    b.title = it.slots ? "Armed: pressing a row records an audio take into it"
            : it.live  ? "Armed: notes you play land on the grid, and pressing a row puts the pattern there"
                       : "Armed: pressing a row puts this instrument's current pattern into it";
    b.addEventListener("click", () => toggleArm(id));
    const screws = plate.querySelector(".screws");
    if (screws) plate.insertBefore(b, screws); else plate.appendChild(b);
  });
  paintArms();
}
function paintArms(){
  Patchwork.roots.forEach(root => {
    const b = root.querySelector(".arm-toggle");
    if (!b) return;
    const on = armed.has(b.dataset.arm);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = on ? "Armed" : "Arm";
  });
}
subs.push(paintArms);

return {register, setArmed, toggleArm, captureRow, note, onChange, track, mount,
        /* A track saying its OWN state moved — the looper starting, stopping, filling or
           emptying a slot. Arming is the shell's and notifies itself; a slot track keeps
           its transport privately, so without this the launcher had no way to know a take
           had appeared. The live page was papering over it with a 400 ms repaint, which is
           why the bug only showed on the studio launcher. */
        changed: notify,
        isArmed: id => armed.has(id),
        get tracks(){ return kit.map(k => ({id: k.id, name: k.name,
                                            canRecord: k.canRecord, live: k.live,
                                            slots: k.slots})); },
        get armedCount(){ return armed.size; }};
})();

/* Audio, small enough to send.

   The looper is the one thing in this studio that is not reducible to state. A pattern is a
   few hundred bytes and a patch is a few dozen; a two-bar take at 48k stereo is 1.5 MB of
   Float32, which is not something to put on a wire once, let alone every time somebody likes
   a take.

   ENCODE TO OPUS when the browser has WebCodecs, which is ~50 KB for those two bars at
   96 kbps — thirty times smaller, and inaudibly so for a loop. Fall back to 16-bit PCM
   where it does not, because half size and definitely-works beats thirty times smaller and
   maybe. The fallback is not a nicety: WebCodecs' AudioEncoder is still missing from some
   browsers this app otherwise runs in perfectly.

   ⚠️ EVERYTHING HERE IS BASE64 at the edge, because the relay speaks text frames and
   nothing else. That is a third larger than the bytes it carries, which is a real cost and
   still leaves Opus far ahead of raw. Teaching the relay binary frames is the obvious
   improvement and is worth doing the day something bigger than a loop needs to travel. */
Patchwork.codec = (() => {
"use strict";

const hasWebCodecs = typeof AudioEncoder !== "undefined" && typeof AudioDecoder !== "undefined";

/* ---- base64, in chunks ----
   String.fromCharCode.apply with a whole megabyte of bytes overflows the argument list and
   throws — a failure that looks like the encoder breaking on large takes only. */
function toBase64(bytes){
  let out = "";
  const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step)
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  return btoa(out);
}
function fromBase64(s){
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---- the fallback: 16-bit PCM ----
   Interleaved, because it is going straight back out as one blob and de-interleaving on
   arrival is cheaper than carrying two arrays through base64. */
function pcmEncode(chans){
  const n = chans[0].length, ch = chans.length;
  const out = new Int16Array(n * ch);
  for (let i = 0; i < n; i++)
    for (let c = 0; c < ch; c++){
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      out[i * ch + c] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
  return new Uint8Array(out.buffer);
}
function pcmDecode(bytes, ch, frames){
  const src = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 2);
  const out = [];
  for (let c = 0; c < ch; c++) out.push(new Float32Array(frames));
  for (let i = 0; i < frames; i++)
    for (let c = 0; c < ch; c++) out[c][i] = src[i * ch + c] / 0x8000;
  return out;
}

/* ---- Opus ----
   Every Opus packet is a key frame, so each encoded chunk is self-contained and the wire
   format is just their lengths and their bytes. */
function packChunks(chunks){
  let total = 0;
  chunks.forEach(c => { total += 4 + c.length; });
  const out = new Uint8Array(total);
  const view = new DataView(out.buffer);
  let o = 0;
  chunks.forEach(c => { view.setUint32(o, c.length); o += 4; out.set(c, o); o += c.length; });
  return out;
}
function unpackChunks(bytes){
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const out = [];
  let o = 0;
  while (o + 4 <= bytes.length){
    const n = view.getUint32(o); o += 4;
    if (o + n > bytes.length) break;
    out.push(bytes.subarray(o, o + n)); o += n;
  }
  return out;
}

/* Opus runs at 48k and takes 20 ms frames. Anything else is resampled by the encoder, but
