       longer running and leave a bar of notes behind after the stop. */
    if (!SEQ.playing) return;
    const i = scheduleStep(stepIndex, at);
    marks.push({i, t: at, end: at + step});
    /* swing advances alternately 2*sw*step and (2-2*sw)*step, summing to 2*step over a
       pair, so the bar's total length is unchanged however hard it shuffles — CS·1's
       model, copied deliberately rather than reinvented */
    const r = Patchwork.clock.rate;
    nextTime += r * ((stepIndex % 2 === 0) ? 2 * SEQ.swing * step : (2 - 2 * SEQ.swing) * step);
    stepIndex++;
  }
  while (marks.length > 24) marks.shift();
}

function startPlay(){
  ensureAudio();
  SEQ.playing = true;
  stepIndex = 0; marks = [];
  /* lands on the running grid when another instrument is already going — see shell/clock.js */
  nextTime = Patchwork.clock.claim(4);
  tick();
  Patchwork.clock.run(tick);
  timer = tick;
  playBtn.classList.add("on");
  playBtn.textContent = "■ Stop";
  requestAnimationFrame(paint);
}

function stopPlay(){
  SEQ.playing = false;
  Patchwork.clock.stop(tick); timer = null;
  chokeOpenHat(ctx ? ctx.currentTime : 0);
  midiPanic();
  playBtn.classList.remove("on");
  playBtn.textContent = "▶ Play";
  clearMarks();
}

/* ============ ui ============ */

const playBtn = $("#play"), tempoOut = $("#tempoOut"), lanesEl = $("#lanes");
const clampf = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---- the lane grid ---- */
function buildLanes(){
  lanesEl.textContent = "";
  ORDER.forEach(id => {
    const row = document.createElement("div");
    row.className = "lane";
    const nm = document.createElement("button");
    nm.className = "lane-name" + (id === SEQ.lane ? " sel" : "");
    nm.textContent = VOICES[id].name;
    nm.dataset.v = id;
    nm.title = VOICES[id].full + " — click to hear it and bring it up in Voice, shift-click to play it without selecting";
    row.appendChild(nm);
    const pads = document.createElement("div");
    pads.className = "pads";
    for (let i = 0; i < MAX_STEPS; i++){
      const b = document.createElement("button");
      b.className = "pad";
      b.dataset.v = id; b.dataset.i = i;
      b.setAttribute("aria-label", VOICES[id].name + " step " + (i + 1));
      pads.appendChild(b);
    }
    row.appendChild(pads);
    lanesEl.appendChild(row);
  });
  paintPads();
}

function paintPads(){
  /* the grid's column count follows the pattern length, so 8 steps fill the row rather
     than leaving half of it empty */
  /* Sixteen columns is the widest a lane stays hittable at a panel's width, so anything
     longer wraps into rows of 16 inside the same grid rather than shrinking the pads to
     slivers. 64 steps is four rows per lane, which is what 64 steps looks like. */
  const cols = Math.min(16, SEQ.len);
  $$(".pads").forEach(p => p.style.setProperty("--steps", cols));
  $$(".pad").forEach(b => {
    const id = b.dataset.v, i = +b.dataset.i;
    b.hidden = i >= SEQ.len;
    const v = steps[id][i];
    b.classList.toggle("on", v > 0);
    b.classList.toggle("acc", v === 2);
    b.classList.toggle("beat", i % 4 === 0);
  });
}

/* Sounding a voice on demand, with no transport running. "Which one is LT again?" is the
   question the Voice faders exist to answer, and answering it should not mean programming
   a step, pressing Play and clearing it again. */
function audition(id){
  ensureAudio();
  fire(id, ctx.currentTime + .005, 1);
  flashLane(id);
}

/* A click cycles off → on → accent → off. Three states on one control, because a
   separate accent mode means holding a modifier to program the thing you most want to
   program — the downbeat of a kick is accented nearly every time. */
lanesEl.addEventListener("click", e => {
  const nm = e.target.closest(".lane-name");
  if (nm){
    const id = nm.dataset.v;
    /* Plain click selects AND sounds it. Shift is the performance gesture and keeps the
       selection where it is, so you can finger-drum one voice while editing another.

       Only the shift form writes to the grid. Selecting a voice to tweak is not playing a
       note, and with DR·1 armed a recording selection would punch a hit into the pattern
       every time you reached for the Tune fader. */
    if (e.shiftKey) Patchwork.record.note("dr1", id, 110);
    else {
      SEQ.lane = id;
      $$(".lane-name").forEach(x => x.classList.toggle("sel", x.dataset.v === id));
      syncVoice();
    }
    audition(id);
    return;
  }
  const pad = e.target.closest(".pad");
  if (!pad) return;
  const id = pad.dataset.v, i = +pad.dataset.i;
  steps[id][i] = (steps[id][i] + 1) % 3;
  SEQ.lane = id;
  $$(".lane-name").forEach(x => x.classList.toggle("sel", x.dataset.v === id));
  syncVoice();
  paintPads();
});

function flashLane(id){
  const el = lanesEl.querySelector('.lane-name[data-v="' + id + '"]');
  if (!el) return;
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 90);
}

/* ---- playhead ----
   Painted from the marks the scheduler left, looked up against the audio clock — the
   same approach CS·1 and MS·1 use. Reading stepIndex directly would show the lookahead's
   position, which is up to 200 ms ahead of what you can hear. */
function paint(){
  if (!SEQ.playing){ clearMarks(); return; }
  const now = ctx.currentTime;
  let cur = -1;
  for (let k = marks.length - 1; k >= 0; k--)
    if (marks[k].t <= now && now < marks[k].end){ cur = marks[k].i; break; }
  $$(".pad").forEach(b => b.classList.toggle("now", +b.dataset.i === cur));
  if (cur >= 0 && cur !== lastPainted){
    ORDER.forEach(id => { if (steps[id][cur]) flashLane(id); });
    lastPainted = cur;
  }
  requestAnimationFrame(paint);
}
let lastPainted = -1;
function clearMarks(){ $$(".pad").forEach(b => b.classList.remove("now")); lastPainted = -1; }

/* ---- horizontal faders ----
   Registered the way CS·1's are, so MIDI learn and patch save would get them for free. */
const faderCtl = {};
/* min and max are functions, not numbers, because Tune's range depends on which voice is
   selected — a kick tuned to a hat's 40 Hz fundamental is inaudible, and a hat at a
   kick's 48 Hz is a buzz. One fader serving eight voices needs the range to move with
   the selection rather than being remapped after the fact. */
function makeFader(sel, get, set, fmt, min, max){
  const el = $(sel), slot = el.querySelector(".hslot"), cap = el.querySelector(".hcap"),
        val = el.querySelector(".hval");
  const lo = () => (typeof min === "function" ? min() : min);
  const hi = () => (typeof max === "function" ? max() : max);
  function paintF(){
    const a = lo(), b = hi();
    cap.style.left = (clampf((get() - a) / (b - a), 0, 1) * 100) + "%";
    val.textContent = fmt(get());
  }
  el.addEventListener("pointerdown", e => {
    const r = slot.getBoundingClientRect();
    const move = ev => {
      const cx = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0].clientX);
      const x = clampf((cx - r.left) / r.width, 0, 1);
      const a = lo(), b = hi();
      set(a + x * (b - a));
      paintF();
    };
    move(e);
    el.classList.add("dragging");
    el.setPointerCapture && e.pointerId != null && el.setPointerCapture(e.pointerId);
    const up = () => {
      el.classList.remove("dragging");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
  faderCtl[sel] = paintF;
  paintF();
  return paintF;
}

/* ---- per-voice controls ----
   One set of faders serving whichever lane is selected, rather than four controls per
   voice times eight voices. Thirty-two knobs on a panel this size is a wall, and a drum
   machine is played on the grid — the voice faders are for setting up, not performing. */
const TUNE_RANGE = {bd:[28,90], sd:[120,320], cp:[500,2200], lt:[55,180],
                    ht:[100,320], ch:[24,70], oh:[24,70], rs:[900,2600]};
const cur = () => P[SEQ.lane];

function syncVoice(){
  const v = VOICES[SEQ.lane];
  $("#voiceTag").textContent = v.name;
  $("#voiceMeta").textContent = v.full;
  ["#tuneF", "#toneF", "#decayF", "#levelF"].forEach(k => faderCtl[k] && faderCtl[k]());
}

makeFader("#tuneF",  () => cur().tune,  v => { cur().tune = v; },
          v => (v < 100 ? v.toFixed(1) : Math.round(v)) + " Hz",
          () => TUNE_RANGE[SEQ.lane][0], () => TUNE_RANGE[SEQ.lane][1]);
makeFader("#toneF",  () => cur().tone,  v => { cur().tone = v; },
          v => Math.round(v * 100) + "%", 0, 1);
makeFader("#decayF", () => cur().decay, v => { cur().decay = v; },
          v => (v * 1000).toFixed(0) + " ms", .02, 1.2);
makeFader("#levelF", () => cur().level, v => { cur().level = v; },
          v => Math.round(v * 100) + "%", 0, 1);
makeFader("#swingF",  () => SEQ.swing,     v => { SEQ.swing = v; },
          v => Math.round(v * 100) + "%", .5, .75);
makeFader("#accentF", () => SEQ.accentAmt, v => { SEQ.accentAmt = v; },
          v => Math.round(v * 100) + "%", 0, .8);

/* ---- transport and pattern controls ---- */
playBtn.addEventListener("click", () => SEQ.playing ? stopPlay() : startPlay());
$("#clearPat").addEventListener("click", () => { ORDER.forEach(k => steps[k].fill(0)); paintPads(); });
$("#defaultPat").addEventListener("click", () => { loadDefaultPattern(); paintPads(); });
$("#panic").addEventListener("click", () => { stopPlay(); midiPanic(); });

function setBpm(v, fromShell){
  const b = Math.round(clampf(v, 40, 240));
  tempoOut.textContent = b;
  if (!fromShell) Patchwork.clock.setBpm(b, "dr1");
}
Patchwork.clock.onTempo("dr1", v => setBpm(v, true), 120);
setBpm(Patchwork.clock.bpm, true);
$("#bpmUp").addEventListener("click", () => setBpm(Patchwork.clock.bpm + 1));
$("#bpmDown").addEventListener("click", () => setBpm(Patchwork.clock.bpm - 1));

$("#rate").addEventListener("change", e => { SEQ.rate = e.target.value; });
$("#len").addEventListener("change", e => { SEQ.len = +e.target.value; paintPads(); });

/* Space plays, and only when this panel owns the keyboard — see shell/host.js. */
onKey("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === " " && !e.repeat){ SEQ.playing ? stopPlay() : startPlay(); e.preventDefault(); }
});

/* The computer keyboard is the shell's — see shell/keys.js. A drum machine has no scale,
   so the row maps to the eight LANES in kit order: the same thing a shift-click on a lane
   name does, record.note() included, so a typed part lands on the grid. Keys past the
   eighth map to nothing and are ignored rather than wrapping round to the kick. */
Patchwork.keys.mount(root, {
  map: i => ORDER[i] || null,
  on: (id, v) => {
    Patchwork.record.note("dr1", id, v);
    audition(id);
    SEQ.lane = id;
    $$(".lane-name").forEach(x => x.classList.toggle("sel", x.dataset.v === id));
    syncVoice();
  },
  off: () => {}                    // a drum voice rings out; there is nothing to release
});

buildLanes();
syncVoice();

/* ---- the kit, for a shared jam ----
   Eight voices of four numbers. Not the pattern — that is the scene's — and not the trims,
   which are measured constants rather than anything you dial. */
Patchwork.session.registerPatch("dr1", {
  capture: () => {
    const out = {};
    ORDER.forEach(id => {
      const v = P[id];
      out[id] = {tune: v.tune, tone: v.tone, decay: v.decay, level: v.level};
    });
    return out;
  },
  apply: src => {
    if (!src) return;
    ORDER.forEach(id => {
      const got = src[id]; if (!got) return;
      ["tune", "tone", "decay", "level"].forEach(k => {
        if (typeof got[k] === "number" && isFinite(got[k])) P[id][k] = got[k];
      });
    });
    syncVoice();
  }
});

/* ---- somebody else's hits ----
   A lane id rather than a note number, because that is what DR·1's keyboard sends. A drum
   voice rings out on its own, so there is nothing to release. */
Patchwork.session.registerVoice("dr1", {
  on: id => { if (VOICES[id]) audition(id); },
  off: () => {}
});

/* ============ midi ============ */
/* General MIDI drum notes, so a pad controller or a DAW track drives the kit without a
   mapping dialogue. These are the GM percussion numbers; anything not in the map is
   ignored rather than triggering the nearest voice, because a wrong drum is worse than
   no drum. */
const GM = {36:"bd", 35:"bd", 38:"sd", 40:"sd", 39:"cp", 41:"lt", 45:"lt",
            47:"ht", 48:"ht", 42:"ch", 44:"ch", 46:"oh", 37:"rs"};
const OUT_NOTE = {bd:36, sd:38, cp:39, lt:41, ht:47, ch:42, oh:46, rs:37};

const MIDI = {access:null, in:null, out:null, ch:9, inCh:-1, noteOut:false};
const ledEl = $("#midiLed");
const midiInSel = $("#midiIn"), midiOutSel = $("#midiOut"),
      midiChSel = $("#midiCh"), midiInChSel = $("#midiInCh");

/* Channel 10 (index 9) is where drums live by convention, so that is the default out. */
function fillChannels(){
  midiInChSel.appendChild(Object.assign(document.createElement("option"),
    {value:"-1", textContent:"Omni"}));
  for (let c = 0; c < 16; c++){
    midiInChSel.appendChild(Object.assign(document.createElement("option"),
      {value:String(c), textContent:String(c + 1)}));
    midiChSel.appendChild(Object.assign(document.createElement("option"),
      {value:String(c), textContent:String(c + 1)}));
  }
  midiInChSel.value = "-1";
  midiChSel.value = "9";
}
fillChannels();
midiInChSel.addEventListener("change", () => { MIDI.inCh = parseInt(midiInChSel.value, 10); describe(); });
midiChSel.addEventListener("change", () => { MIDI.ch = parseInt(midiChSel.value, 10); });

function ports(kind){ return Patchwork.midi.ports(kind); }

function fillPorts(){
  [[midiInSel, "inputs"], [midiOutSel, "outputs"]].forEach(([sel, kind]) => {
    const keep = sel.value;
    sel.textContent = "";
    sel.appendChild(Object.assign(document.createElement("option"),
      {value:"", textContent:"— none —"}));
    ports(kind).forEach(p => sel.appendChild(Object.assign(document.createElement("option"),
      {value:p.id, textContent:p.name || p.id})));
    if (keep && ports(kind).some(p => p.id === keep)) sel.value = keep;
  });
}

function onMidi(e){
  const d = e.data, s = d[0];
  if (s >= 0xF0) return;                       // realtime carries no channel; the clock is the shell's
  if (MIDI.inCh >= 0 && (s & 0x0F) !== MIDI.inCh) return;
  const type = s & 0xF0;
  if (type !== 0x90 || d[2] === 0) return;     // note-off is meaningless for a one-shot
  const id = GM[d[1]];
  if (!id) return;
  ensureAudio();
  Patchwork.record.note("dr1", id, d[2]);
  fire(id, ctx.currentTime + .003, d[2] / 127);
  flashLane(id);
}

/* Mirrors the sequencer only, and goes through the same stepEvent() the engine reads, so
   what sounds and what leaves the port cannot drift. A drum hit has no duration worth
   sending, so note-off follows immediately — the note length of a one-shot means nothing
   to the receiver, and holding it open risks a stuck note on a panic. */
function sendHit(ev){
  if (!MIDI.noteOut || !MIDI.out) return;
  const n = OUT_NOTE[ev.id];
  if (n == null) return;
  const t = (ev.t - ctx.currentTime) * 1000 + performance.now();
  try{
    MIDI.out.send([0x90 | MIDI.ch, n, Math.round(ev.vel * 127)], t);
    MIDI.out.send([0x80 | MIDI.ch, n, 0], t + 20);
  }catch(err){}
}

function midiPanic(){
  if (!MIDI.out) return;
  for (let c = 0; c < 16; c++){
    try{ MIDI.out.send([0xB0 | c, 123, 0]); }catch(e){}
  }
}

$("#noteOut").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  MIDI.noteOut = b.dataset.o === "on";
  $$("#noteOut button").forEach(x => x.classList.toggle("on", x === b));
});

function bindInput(){ MIDI.in = Patchwork.midi.select(midiInSel.value); }
function followInput(pt){
  MIDI.in = pt;
  if (midiInSel.value !== (pt ? pt.id : "")) midiInSel.value = pt ? pt.id : "";
  ledEl.classList.toggle("ready", !!pt && !ledEl.classList.contains("err"));
}
function bindOutput(){
  midiPanic();
  MIDI.out = midiOutSel.value ? ports("outputs").find(p => p.id === midiOutSel.value) || null : null;
}
midiInSel.addEventListener("change", bindInput);
midiOutSel.addEventListener("change", bindOutput);

function say(msg, bad){
  $("#midiNote").innerHTML = msg;
  ledEl.classList.toggle("err", !!bad);
}
function describe(){
  const i = ports("inputs").length, o = ports("outputs").length;
  say(i + " input" + (i === 1 ? "" : "s") + " · " + o + " output" + (o === 1 ? "" : "s")
    + " — GM drum notes trigger the kit (36 kick, 38 snare, 42 hat). "
    + (MIDI.inCh < 0 ? "Listening on <b>every channel</b>."
                     : "Listening on <b>channel " + (MIDI.inCh + 1) + "</b> only."));
}

function initMidi(){
  if (!navigator.requestMIDIAccess){
    say("Web MIDI isn't available in this browser. Chrome and Edge support it.", true);
    return;
  }
  if (!window.isSecureContext){
    say("Web MIDI needs a secure context — serve over <code>localhost</code>.", true);
    return;
  }
  Patchwork.midi.route("dr1", onMidi, pt => { fillPorts(); followInput(pt); bindOutput(); describe(); });
  Patchwork.midi.open().then(a => {
    MIDI.access = a;
    fillPorts();
    const ins = ports("inputs");
    if (!Patchwork.midi.port && ins.length){ midiInSel.value = ins[0].id; bindInput(); }
    else followInput(Patchwork.midi.port);
    describe();
  }).catch(err => {
    say("MIDI access was denied or failed (" + ((err && err.name) || "error") + ").", true);
  });
}

/* ============ boot ============ */

function ensureAudio(){
  initAudio();
  Patchwork.audio.resume();
  return ctx.state;
}

/* Render one voice offline, the way __ms1.renderPatch() and __cs1.renderChord() do.
   This is what the kit's trims are measured with — see measure() below. */
async function renderHit(id, opts){
  const o = opts || {};
  const dur = o.dur || 1.5, rate = o.rate || 48000;
  const saved = {ctx, kit, comp, noiseBuf};
  const savedOpen = openHat;
  openHat = null;
  ctx = null;
  const off = new OfflineAudioContext(2, Math.ceil(rate * dur), rate);
  try{
    initAudio(off);
    if (o.params) Object.assign(P[id], o.params);
    /* `hits` renders a whole pattern rather than one voice, which is the only way to get
       at the cost that matters: a drum machine's load is hits per second, and a single
       one-shot in a long buffer measures mostly silence. */
    if (o.hits) o.hits.forEach(h => fire(h.id, h.t, h.vel == null ? 1 : h.vel));
    else fire(id, 0, o.vel == null ? 1 : o.vel);
    return await off.startRendering();
  } finally {
    ctx = saved.ctx; kit = saved.kit; comp = saved.comp; noiseBuf = saved.noiseBuf;
    openHat = savedOpen;
  }
}

/* Measure every voice and report the trim each one needs.

   The metric is the loudest 30 ms anywhere in the hit, not RMS over a fixed window.
   That matters more here than anywhere else in the repo, because a kit spans 45 ms
   (closed hat) to 420 ms (kick) and any fixed window is wrong for one end of it:

     500 ms — MS·1's window. Divides a hat's energy by ten parts silence.
     150 ms — the obvious fix. Still under-measures a 45 ms hat by ~5 dB while measuring
              a 380 ms open hat in full, which handed two voices from the SAME generator
              trims 13 dB apart. That is the metric being wrong, not the voices.
     30 ms peak-RMS — self-scaling. Every voice is measured over the part of itself that
              is actually loud, so length stops leaking into level.

   It is also the better perceptual proxy: for transients the ear integrates over roughly
   this long, which is why a short bright hit and a long quiet one can measure the same
   in RMS and sound nothing alike.

   ⚠️ Stochastic, for the same reason MS·1's harness is: every noise source starts at a
   random offset per hit, so snare, clap, hats and the kick's click do not repeat exactly.
   `runs` averages; 8 holds the numbers to about a tenth of a dB. Never read one run. */
async function measure(runs){
  const N = runs || 8;
  const rows = {};
  for (const id of ORDER){
    let sum = 0;
    for (let r = 0; r < N; r++){
      const b = await renderHit(id, {dur: 1.5});
      const L = b.getChannelData(0), R = b.getChannelData(1);
      const win = Math.round(b.sampleRate * .03);
      /* sliding sum-of-squares, so this stays one pass over the buffer */
      let acc = 0, best = 0;
      for (let i = 0; i < L.length; i++){
        const m = (L[i] + R[i]) / 2;
        acc += m * m;
        if (i >= win){ const o = (L[i-win] + R[i-win]) / 2; acc -= o * o; }
        if (i >= win && acc > best) best = acc;
      }
      sum += Math.sqrt(best / win);
    }
    const db = 20 * Math.log10(sum / N);
    const target = TARGET_BD + BALANCE[id];
    rows[id] = {measured: +db.toFixed(2), target: target,
                needs: +(target - db).toFixed(2), applied: TRIM[id]};
  }
  return rows;
}

/* ---- scenes ----
   A DR·1 pattern is the grid and how it is read. Not the voice parameters: firing a
   scene should change the beat, not retune the kit under you. */
Patchwork.scenes.register("dr1", {
  name: "DR·1",
  isPlaying: () => SEQ.playing,
  start: () => { ensureAudio(); if (!SEQ.playing) startPlay(); },
  stop: () => { if (SEQ.playing) stopPlay(); },
  capture: () => ({steps: JSON.parse(JSON.stringify(steps)),
                   len: SEQ.len, rate: SEQ.rate, swing: SEQ.swing, accentAmt: SEQ.accentAmt}),
  apply: pat => {
    ORDER.forEach(k => { if (pat.steps && pat.steps[k]) steps[k] = pat.steps[k].slice(); });
    if (pat.len) SEQ.len = pat.len;
    if (pat.rate) SEQ.rate = pat.rate;
    if (pat.swing != null) SEQ.swing = pat.swing;
    if (pat.accentAmt != null) SEQ.accentAmt = pat.accentAmt;
    $("#len").value = String(SEQ.len);
    $("#rate").value = SEQ.rate;
    paintPads();
  }
});

/* A drum grid records differently: the note picks the LANE, not a pitch, and the same
   nearest-step rounding applies. GM numbers come in from a pad controller; an audition
   click passes the lane id straight through. */
Patchwork.record.register("dr1", {
  name: "DR·1",
  write: (midi, vel, when) => {
    const id = typeof midi === "string" ? midi : GM[midi];
    if (!id || !SEQ.playing || !marks.length) return -1;
    const ctx = Patchwork.audio.ctx;
    const t = when == null ? ctx.currentTime : when;
    let m = null;
    for (let k = marks.length - 1; k >= 0; k--) if (marks[k].t <= t){ m = marks[k]; break; }
    if (!m) m = marks[0];
    const i = ((t - m.t) > (m.end - m.t) / 2 ? m.i + 1 : m.i) % SEQ.len;
    steps[id][i] = vel >= 100 ? 2 : 1;
    paintPads();
    return i;
  }
});

initMidi();

/* A test hook, not a feature — the same one CS·1 and MS·1 carry. */
window.__dr1 = {P, SEQ, steps, ORDER, VOICES, TRIM, BALANCE, TARGET_BD,
                fire, renderHit, measure, ensureAudio, MIDI, onMidi,
                get ctx(){ return ctx; }};
});

/* Runs last, once every instrument on the page has registered.

   Anything that has to see the whole set of instruments belongs here rather than in one
   of them — an instrument cannot know how many others share its page, and should not
   have to. */
(() => {
"use strict";
Patchwork.faces.mount();
/* after faces, so the plate buttons land in a stable order */
Patchwork.record.mount();
Patchwork.session.mountOwners();

/* The default derives from the page rather than from a per-build flag: a lone instrument
   is its whole self, and a page with several opens on faces, because three full panels is
   the wall the faces exist to avoid. A build added later gets the right default without
   anyone remembering to set it. */
if (Patchwork.roots.length > 1) Patchwork.faces.setAll(true);

/* One tempo for the page means ONE control for it. Every panel grew its own, and since
   the clock has been shared they all show the same number and all move together — five of
   the six were noise, and a row of disagreeing-looking readouts is worse than noise. Each
   panel marks its block with `data-hosted`; with more than one instrument on the page the
   studio's master takes over and the panels' come out.

   Derived from the page, exactly like the faces default above: a STANDALONE build keeps
   its own tempo control, because there is nothing else on that page to own it. */
if (Patchwork.roots.length > 1)
  Patchwork.roots.forEach(r => r.classList.add("hosted"));
})();
</script>
</body>
</html>
