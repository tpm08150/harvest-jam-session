
<div class="st-head">
  <span class="st-brand">Jam Session</span>
  <div class="st-seg" id="stView" role="group" aria-label="View">
    <!-- ⚠️ THE ORDER IS THE LAUNCHKEY'S, not the order these were built in. Its encoder-mode
         pads read Plug-in, Mixer, Sends, Transport left to right, and Shift and one of them
         is how you change view now — so a tab strip in a different order means the second
         pad and the second tab are different places, and the hand learns one of them wrong.
         Nothing here keys off position; every view is reached by its data-v. -->
    <button data-v="studio" class="st-sel">Studio</button>
    <!-- ⚠️ The light is on the TAB, not on the deck. You press record and then switch away
         to actually play something, which is the whole point of the machine — so the one
         place the state has to be visible is the view you are leaving it from. -->
    <button data-v="tape">Tape<i class="tp-dot" id="tpDot" hidden></i></button>
    <button data-v="live">Live</button>
    <button data-v="lib">Library</button>
  </div>
  <span class="st-hint">click a panel to give it the keyboard</span>
  <!-- ⚠️ The one thing on this page that was NOT persistent. Sounds save as patches, the desk
       remembers its knobs, the tape keeps its take — and the scenes, which are the song,
       lived only in memory. Here rather than inside a panel because a project is the whole
       page's, the way the view switch and the jam control are. -->
  <div class="st-proj" id="stProj">
    <label class="st-lab" for="stProjSel">Project</label>
    <select id="stProjSel"><option value="">&mdash; unsaved &mdash;</option></select>
    <button class="st-xport st-jam-btn" id="stProjSave">Save</button>
    <button class="st-xport st-jam-btn st-proj-more" id="stProjMore"
            aria-expanded="false" aria-haspopup="true" title="Save as, delete, export, import">&hellip;</button>
    <div class="st-proj-menu" id="stProjMenu" hidden>
      <button class="st-xport" id="stProjSaveAs">Save as&hellip;</button>
      <button class="st-xport" id="stProjRevert">Revert</button>
      <button class="st-xport" id="stProjExport">Export&hellip;</button>
      <button class="st-xport" id="stProjImport">Import&hellip;</button>
      <button class="st-xport st-proj-del" id="stProjDelete">Delete</button>
      <input type="file" id="stProjFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <!-- A jam is a room name. Anyone on the same one plays the same grid — see
       shell/session.js for why that is state and not audio. -->
  <div class="st-jam" id="stJam">
    <button class="st-xport st-jam-btn" id="stJamBtn">Start a jam</button>
    <button class="st-xport st-jam-btn" id="stJamJoin">Join&hellip;</button>
    <button class="st-xport st-jam-btn" id="stTalk" hidden>&#127908; Talk</button>
    <span class="st-jam-who" id="stJamWho"></span>
    <!-- What is actually running, so a jam can be picked rather than named from memory. -->
    <div class="st-jam-list" id="stJamList" hidden></div>
  </div>
</div>
