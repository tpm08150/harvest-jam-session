
<div class="st-head">
  <span class="st-brand">Harvest Jam Session</span>
  <div class="st-seg" id="stView" role="group" aria-label="View">
    <button data-v="studio" class="st-sel">Studio</button>
    <button data-v="live">Live</button>
  </div>
  <span class="st-hint">click a panel to give it the keyboard</span>
  <!-- A jam is a room name. Anyone on the same one plays the same grid — see
       shell/session.js for why that is state and not audio. -->
  <div class="st-jam" id="stJam">
    <button class="st-xport st-jam-btn" id="stJamBtn">Start a jam</button>
    <button class="st-xport st-jam-btn" id="stJamJoin">Join&hellip;</button>
    <button class="st-xport st-jam-btn" id="stTalk" hidden>&#127908; Talk</button>
    <span class="st-jam-who" id="stJamWho"></span>
    <!-- What is actually running, so a jam can be picked rather than named from memory. -->
    <div class="st-jam-list" id="stJamList" hidden></div>
  </div>
  <div class="st-seg" id="stFaces" role="group" aria-label="How much of each instrument to show">
    <button data-f="face" class="st-sel">Faces</button>
    <button data-f="panel">Full panels</button>
  </div>
</div>
