
<div class="st-live" id="stLive" hidden>
  <div class="st-live-bar">
    <button class="st-xport" id="livePlay">▶ Play all</button>
    <div class="st-tempo">
      <button id="liveDown" aria-label="Slower">−</button>
      <span id="liveBpm">120</span>
      <button id="liveUp" aria-label="Faster">+</button>
    </div>
    <div class="st-seg st-quant" id="liveQuant" role="group" aria-label="When a fired row lands">
      <button data-q="instant">Instant</button>
      <button data-q="bar">Bar</button>
      <button data-q="pattern" class="st-sel">Pattern</button>
    </div>
    <span class="st-live-hint" id="liveHint">Arm a track to record into a scene row.</span>
  </div>
  <div class="st-live-grid" id="liveGrid"></div>
</div>
