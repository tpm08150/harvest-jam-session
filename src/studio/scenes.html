<div class="st-scenes">
  <div class="st-scenes-head">
    <span class="st-brand">Scenes</span>
    <!-- The page's tempo, not an instrument's. Every panel had its own and they all moved
         together, so five of the six were noise — see shell/boot.js. -->
    <div class="st-master">
      <span class="st-lab" id="stBpmLab">Tempo</span>
      <div class="st-tempo" role="group" aria-labelledby="stBpmLab">
        <button id="stDown" aria-label="Slower">&minus;</button>
        <span id="stBpm">120</span>
        <button id="stUp" aria-label="Faster">+</button>
      </div>
    </div>
    <div class="st-master">
      <span class="st-lab" id="stQuantLab">Lands on</span>
      <div class="st-seg st-quant" id="stQuant" role="group" aria-labelledby="stQuantLab">
      <button data-q="instant">Instant</button>
      <button data-q="bar">Bar</button>
      <button data-q="pattern" class="st-sel">Pattern</button>
      </div>
    </div>
    <div class="st-master">
      <span class="st-lab">Transport</span>
      <button class="st-xport st-stop" id="stStop">&#9632; Stop</button>
    </div>
    <div class="st-master">
      <span class="st-lab">Pattern</span>
      <div class="st-seg" id="stBarCount" role="group" aria-label="Pattern length in bars">
        <button data-b="1">1</button>
        <button data-b="2">2</button>
        <button data-b="4" class="st-sel">4</button>
        <button data-b="8">8</button>
      </div>
    </div>
    <div class="st-master">
      <span class="st-lab">Bar</span>
      <div class="st-bars" id="stBars" title="Where the pattern is"></div>
    </div>
    <div class="st-master">
      <span class="st-lab">Click</span>
      <div class="st-clickrow">
        <div class="st-seg" id="stClick" role="group" aria-label="Metronome">
          <button data-c="on">On</button>
          <button data-c="off" class="st-sel">Off</button>
        </div>
        <input type="range" id="stClickLvl" class="st-lvl" min="0" max="100" value="70"
               aria-label="Metronome level">
      </div>
    </div>
    <span class="st-hint">click a cell to add or edit &middot; shift-click to delete &middot; click &#9654; to fire the row &middot; nothing lands until the next loop point</span>
  </div>
  <div class="st-grid" id="stGrid"></div>
</div>
