<!-- ⚠️ A FIFTH TAB, AND THE ONLY ONE WITH NO BUTTON ON THE LAUNCHKEY. The other four are the
     controller's own encoder-mode pads and sit in its order for that reason; this one is
     deliberately not among them. Settings is what you do once with a screen in front of you —
     which interface, which channels, which MIDI port — and a box that boots into this has
     already had it done. Nothing here needs to be reachable mid-performance.

     ⚠️ AND IT CAME OUT OF SCENES rather than being copied there. Both of these panels lived
     under the Studio view, below the launcher, where they were in the way of the thing that
     view is for and out of sight of anyone looking for them. Two answers to "where do I set
     this up" is worse than either. -->
<section class="st-settings" id="stSettings" hidden>
  <div class="st-settings-head">
    <span class="st-brand">Settings</span>
    <span class="st-hint">what the rack is plugged into</span>
  </div>

<!-- Audio, laid out like the MIDI panel below it because it answers the same shape of
       question: what the rack is plugged into, and what each instrument does with that.

       ⚠️ ONE DEVICE, MANY CHANNELS, and the two are not the same question. WHICH DEVICE is
       the whole context's — setSinkId belongs to the AudioContext and every strip shares one
       so that the master, the sends and the tape all see the same signal — so it is the
       global row at the top and it overrides everything. WHICH CHANNELS of that device an
       instrument lands on is a graph question, costs a merger and a splitter, and is
       therefore per instrument. Plug in an eight-out interface, put the drums on 3-4, take
       separate feeds to a desk.

       ⚠️ A pair takes the instrument OFF the main mix. Audible on 1-2 as well as on 3-4 is
       not routed anywhere, it is doubled. The tape and the looper are unaffected — they tap
       strips directly rather than the master sum. -->
  <div class="st-midi" id="stAudio">
    <div class="st-midi-top">
      <span class="st-lab">Audio</span>
      <div class="st-midi-port">
        <label class="st-lab" for="stAudioOut">Output</label>
        <select id="stAudioOut"><option value="">System default</option></select>
      </div>
      <button class="st-xport" id="stAudioScan">Rescan</button>
    </div>
    <div class="st-midi-rows" id="stAudioRows"></div>
    <p class="st-midi-note" id="stAudioNote"></p>
  </div>

<!-- One MIDI setup for the rack. Every instrument already filtered by channel on its own
       way in and every panel grew its own selects to set that — six copies of one question,
       and the answer lived inside whichever panel you had to open to find it. The port was
       always the page's; now the channels are too. -->
  


  <div class="st-midi" id="stMidi">
    <div class="st-midi-top">
      <span class="st-lab">MIDI</span>
      <div class="st-midi-port">
        <label class="st-lab" for="stMidiIn">Input</label>
        <select id="stMidiIn"><option value="">&mdash; none &mdash;</option></select>
      </div>
      <!-- ⚠️ ONE CABLE OUT FOR THE RACK, the same shape as the input beside it and as the
           audio panel above. Every panel that speaks MIDI grew its own output port select —
           three answers to a question with one answer, each behind a panel you had to open
           to find. The channel is the instrument's; the cable is the page's. -->
      <div class="st-midi-port">
        <label class="st-lab" for="stMidiOut">Output</label>
        <select id="stMidiOut"><option value="">&mdash; none &mdash;</option></select>
      </div>
      <!-- A controller you pick rather than teach. The list holds every profile in
           shell/surface.js that can see its hardware on this machine right now, so an
           empty list is an honest "nothing I know about is plugged in" rather than a
           menu of things that will not work. -->
      <div class="st-midi-port">
        <label class="st-lab" for="stSurface">Controller</label>
        <select id="stSurface"><option value="">&mdash; none &mdash;</option></select>
      </div>
      <label class="st-follow" for="stMidiFollow"
             title="Incoming notes play whichever panel has the keyboard, whatever channel they arrive on">
        <input type="checkbox" id="stMidiFollow">
        <span>Plays the selected panel</span>
      </label>
    </div>
    <div class="st-midi-rows" id="stMidiRows"></div>
    <p class="st-midi-note" id="stMidiNote"></p>
    <p class="st-midi-note" id="stSurfaceNote" hidden></p>
  </div>
</section>
