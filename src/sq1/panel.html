<!-- ⚠️ data-silent: THIS PANEL ENDS AT A CABLE, NOT AT THE AUDIO BUS. It is an instrument by
     every registry's reckoning — it plays a pattern, it belongs to a scene, it answers on a
     channel — and it has no strip, no fader and no output pair, because what it drives is a
     box on the other end of a five-pin lead. Anything that draws a channel per panel has to
     ask, or the desk grows a fader that moves nothing. -->
<div class="unit sq1" data-instrument="sq1" data-silent>
  <div data-face class="plate">
    <span class="brand">SQ&middot;1</span>
    <span class="silk">external sequencer</span>
    <span class="screws"></span>
  </div>

  <!-- ⚠️ THE TRACK SELECTOR IS THE CHANNEL SELECTOR. Sixteen tracks and sixteen MIDI
       channels is not a coincidence to be arranged around — it is the whole model, so there
       is no second control asking which channel a track is on. A lit number has something
       in it; the ring is the one you are editing. -->
  <span class="section">Track</span>
  <div data-face class="row">
    <div class="tracks" id="sqTracks" role="group" aria-label="Track"></div>
  </div>

  <div data-face class="row">
    <div class="seg sm" id="sqStyle" role="group" aria-label="Track style">
      <button data-s="synth" class="on">Synth</button>
      <button data-s="drum">Drum</button>
    </div>
    <div class="seg sm" id="sqMute" role="group" aria-label="Mute this track">
      <button data-m="on">Play</button>
      <button data-m="off">Mute</button>
    </div>
    <span class="grow"></span>
    <span class="silk" id="sqNow">&mdash;</span>
  </div>

  <div class="rule"></div>
  <span class="section">Sequence</span>

  <!-- ⚠️ THE SAME ROW BS·1 AND VC·1 PUT ABOVE THEIR GRIDS, in the same order — steps, rate,
       key, scale — because it is the same sequencer underneath and a rack where the four
       menus above one grid are arranged differently from the four above another is a rack
       you have to read rather than reach into. Per TRACK here rather than per panel, which
       is the one thing about this instrument that is different and is said in words. -->
  <div data-face class="row seqhead">
    <label class="field"><span class="silk">Steps</span>
      <select id="sqLen" aria-label="Steps in this track"></select></label>
    <label class="field"><span class="silk">Rate</span>
      <select id="sqRate" aria-label="Rate of this track"></select></label>
    <label class="field" id="sqKeyField"><span class="silk">Key</span>
      <select id="sqKey" aria-label="Key"></select></label>
    <label class="field" id="sqScaleField"><span class="silk">Scale</span>
      <select id="sqScale" aria-label="Scale"></select></label>
  </div>

  <div data-face class="row seqedit">
    <div class="seg sm" id="sqMode" role="group" aria-label="What a click does">
      <button data-p="play" class="on">Play</button>
      <button data-p="step">Step programming</button>
    </div>
    <!-- ⚠️ THE SAME CONTROL DR·1 HAS, for the same reason it has it: the downbeat of a kick
         is accented nearly every time, and holding a key to program the thing you program
         most is worse than pressing a button once and drawing. On the controller Func does
         it instead, because there is no second control to reach for mid-take and a modifier
         under the same thumb is free. -->
    <div class="seg sm" id="sqWrite" role="group" aria-label="What a press writes" hidden>
      <button data-w="step" class="on">Step</button>
      <button data-w="accent">Accent</button>
    </div>
    <div class="seg sm" id="sqLane" role="group" aria-label="What a click edits">
      <button data-l="on" class="on">Gate</button>
      <button data-l="pitch">Pitch</button>
      <button data-l="accent">Accent</button>
      <button data-l="slide">Slide</button>
      <button data-l="tie">Tie</button>
    </div>
    <button class="btn ghost sm" id="sqClear"></button>
  </div>

  <!-- the synth face: the shared grid every other sequencer here draws -->
  <div data-face class="face" id="sqSynth">
    <div class="seqwrap" id="sqWrap"></div>
    <p class="hint" id="sqHint"></p>
  </div>

  <!-- the drum face: eight lanes, and the note each one sends -->
  <div data-face class="face" id="sqDrum" hidden>
    <div class="lanes" id="sqLanes"></div>
    <p class="hint">click a step to turn it on or off &middot; <b>Func</b> and a pad accents it
      on the controller &middot; ⚠️ the note numbers are yours to set &mdash; the General MIDI
      map is only a start</p>
  </div>

  <div class="rule"></div>
  <div data-face class="row">
    <button class="btn play" id="sqPlay">&#9654; Play</button>
    <span class="grow"></span>
    <button class="btn sm panic" id="sqPanic" title="All notes off on every channel">Panic</button>
  </div>

  <div class="note" id="sqNote"></div>
</div>
