# Jam Session: which output the rack comes up on.
#
#   a USB audio interface, whenever one is plugged in
#   otherwise the Pi 4's 3.5 mm headphone jack
#   HDMI last
#
# ⚠️ HDMI HAS TO BE TOLD. The kiosk keeps the HDMI port switched on for the optional screen (see
# pi/README.md), and a port that is always on could otherwise take the sound as well. A different
# output can still be chosen from the Launchkey — Settings' first knob — and the page remembers it.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-.*" } ]
    actions = { update-props = { priority.driver = 2000, priority.session = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-bcm2835.*" } ]
    actions = { update-props = { priority.driver = 1500, priority.session = 1500 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-.*hdmi.*" } ]
    actions = { update-props = { priority.driver = 500, priority.session = 500 } }
  }
]
