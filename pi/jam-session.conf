# Jam Session on a Raspberry Pi. Read by jam-server and jam-kiosk when they start.
#
# ⚠️ CHANGE jam-session.txt ON THE BOOT PARTITION INSTEAD. It is read after this file and wins, and
# it is on the part of the SD card a Mac or PC can open, so no login is needed.

# The page server's port, on 127.0.0.1 only.
# ⚠️ Not a jam-session.txt setting: provision.sh also writes it into the Chromium policy.
PORT=8123

# The page the Pi boots into. groovebox.html is the rack without the tape, the library and the jam,
# and with song mode in the launcher's place (src/box/parts.txt); index.html is the whole studio.
APP_PAGE=groovebox.html

# Chromium's DevTools port, on 127.0.0.1 only. pi/README.md, "Getting in", says how to reach it.
DEVTOOLS_PORT=9222

# off: no picture at all. Chromium runs headless, the rack draws nothing and is played entirely from the
# Launchkey. Drawing was most of what the rack cost — on the laptop, 0.87 of 1.11 s of CPU a second with
# six instruments playing (2026-09-19) — so this is the default.
# Or the mode a screen on HDMI runs at: WIDTHxHEIGHT, or native for whatever the screen asks for.
# ⚠️ A 4K screen's own mode is four times the drawing of 1080p, which a Pi 4 cannot keep up with: the
# second Pi ran a 4K television at 3840x2160 and managed about two frames a second (2026-09-13).
SCREEN=off

# Extra Chromium command-line flags, space separated.
EXTRA_CHROMIUM_FLAGS=
