# Jam Session on a Raspberry Pi — the parts you are likely to change.
# Sourced by setup.sh and by the systemd units. Edit before running setup.sh,
# or edit /etc/jam-session.conf afterwards and `sudo systemctl restart jam-kiosk`.

# Where the built HTML lives on the Pi.
APP_DIR=/opt/jam-session

# The page that boots. index.html is the studio — the whole rack.
# Any of the standalone pages works too: poly-synth.html, bass.html, drums.html…
APP_PAGE=index.html

PORT=8123

# ---- audio ----
# ⚠️ WHICH WAY OUT IS ALSO CHOOSABLE FROM THE LAUNCHKEY at runtime — the mixer's last
# encoder bank is the output device — so this only sets what the machine comes up on.
#
#   headphone   Pi 4's 3.5 mm jack. Nothing to buy, and it is PWM-driven and noisy.
#               ⚠️ THE PI 5 HAS NO JACK AT ALL. On a Pi 5 this must not be headphone.
#   usb         the first USB audio interface ALSA finds. What you want for anything
#               you would play to another person.
#   hdmi        out of the HDMI port, if something downstream takes it.
#   auto        leave it to ALSA and choose from the controller.
AUDIO_OUT=headphone

# Frames per period. This is the latency dial and the one number worth measuring.
# 256 @ 48 kHz is ~5.3 ms per period; three periods is ~16 ms of buffer. Drop to 128
# if the Pi keeps up, raise to 512 the moment you hear crackle — a synth that stutters
# is worse than a synth that is 10 ms late.
ALSA_PERIOD=256
ALSA_PERIODS=3
SAMPLE_RATE=48000
