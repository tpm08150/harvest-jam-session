# Jam Session: PipeWire's audio buffer.
#
# 1024 frames at 48 kHz is 21 ms a cycle, PipeWire's own default. The first image asked for 256, and on a
# Raspberry Pi 4 running the whole rack notes barely played (2026-09-13) — how much of that was this
# buffer is not yet measured. Chromium adds its own on top, so this is a floor rather than the latency.
# Try 512 once the Pi keeps up; 2048 if it still crackles. Then: sudo systemctl restart jam-kiosk
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}
