# Jam Session: a smaller audio buffer than PipeWire's default.
#
# 256 frames at 48 kHz is 5.3 ms per cycle, and Chromium adds its own buffer on top. Raise
# default.clock.quantum to 512 the moment you hear crackle — a synth that stutters is worse than
# one that is late — or try 128 if the Pi keeps up. Then: sudo systemctl restart jam-kiosk
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 2048
}
