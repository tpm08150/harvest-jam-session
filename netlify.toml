# Static site — no build step, the whole app is one HTML file.
[build]
  publish = "."

# Serve the app at the root without renaming it. status = 200 rewrites rather than
# redirecting, so the URL stays clean.
[[redirects]]
  from = "/"
  to = "/patchwork-chord-synth.html"
  status = 200

# Each instrument gets a clean path of its own. Same rewrite trick, and the root still
# belongs to CS-1 so existing links and bookmarks keep working.
#
# /mono was MS-1, which split into PM-1, VC-1 and BS-1. It points at the poly synth, which
# is what MS-1 mostly was, rather than 404ing a link someone may have saved.
[[redirects]]
  from = "/mono"
  to = "/patchwork-poly-synth.html"
  status = 200

[[redirects]]
  from = "/poly"
  to = "/patchwork-poly-synth.html"
  status = 200

[[redirects]]
  from = "/vocoder"
  to = "/patchwork-vocoder.html"
  status = 200

[[redirects]]
  from = "/bass"
  to = "/patchwork-bass.html"
  status = 200

[[redirects]]
  from = "/drums"
  to = "/patchwork-drums.html"
  status = 200

[[redirects]]
  from = "/looper"
  to = "/patchwork-looper.html"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/patchwork-studio.html"
  status = 200

# The app is a single file that changes on every deploy — never let a browser hold
# a stale copy. (Learned the hard way against a local dev server.)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
